# 로컬 자동 검사. 같은 검사를 CI(.github/workflows/ci.yml)가 최종 판정한다. 헌법 operations.md "가드레일" 절.
# 클론 뒤 주 체크아웃에서 한 번: uv run pre-commit install  (pre-commit과 commit-msg 두 훅이 함께
#   깔린다. git 훅은 워크트리와 공유되고, 워크트리에서 치면 훅의 파이썬 경로가 그 워크트리로 덮인다)
# 체크아웃·워크트리마다: uv sync
# 기계마다 한 번: PowerShell 7(pwsh)을 PATH 에, PATH 에 rg 나 Claude Code(claude)
#   (pytest 의 tests/tools/test_hook_env_read_rg.py 가 부른다. claude 는 실행 이름 rg 로 띄운다. 없으면
#   건너뛰지 않고 빨갛다)
# 커밋할 때마다: Docker 가 켜져 있어야 한다(RAG_TEST_DATABASE_URL 이 이미 닿는 PostgreSQL 을 가리키면 없어도 된다).
#   검사 러너가 pytest 전에 테스트 PostgreSQL 을 띄운다(compose.test.yml, tools/run_checks.py 독스트링).
#   문서만 고친 커밋도 마찬가지다.
default_install_hook_types: [pre-commit, commit-msg]
# 훅은 기본으로 커밋 직전에만 돈다. 커밋 메시지 훅만 commit-msg 단계다. 단계를 적지 않은 always_run 훅은
# commit-msg 단계에서 한 번 더 돌아 pyright·pytest 가 커밋마다 두 번이 된다(agent-os 대기열 118).
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      # CI 도 도는 검사 가운데 파일을 고치지 않는 always_run 검사를 러너가 함께 띄운다. pre-commit 은
      # 훅을 하나씩 돈다. 목록의 원천은 tools/run_checks.py 의 CHECKS 이고, 건너뛰기는 그 id 로
      # SKIP=pytest 처럼 한다. ruff 둘 뒤라 고친 파일을 본다.
      - id: parallel-checks
        name: checks (tools/run_checks.py 의 CHECKS 를 함께 띄운다)
        entry: uv run python tools/run_checks.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
      # 아래 두 검사는 받은 파일을 한 프로세스로(require_serial). 기본은 CPU 수만큼 나눠 uv 를 띄워 두세 배 느리다.
      - id: check-md-tables
        name: markdown tables (GFM 에서 표가 깨지는 자리 — 칸 수, 표 아래 빈 줄, 표가 못 된 머리 행)
        entry: uv run python tools/check_md_tables.py
        language: system
        types: [markdown]
        require_serial: true
      - id: check-line-separators
        name: line separators (날것 U+2028·U+2029·U+0085·홀로 선 CR, .py 의 보이지 않는 공백·서식 문자)
        entry: uv run python tools/check_line_separators.py
        language: system
        types: [text]
        require_serial: true
      # 커밋에 들 판(색인)을 본다. 이 커밋이 더하거나 고친 표는 모든 원문을, 다른 표는 이 커밋이 고친 파일을
      # 가리키는 변이 가운데 부모 판에서 맞던 원문을 본다. 코드만 바뀐 커밋에서도 돌아야 해 always_run
      # 이고, 파일 목록은 도구가 git 에서 읽는다. 러너에 넣지 않고 따로 돈다.
      - id: check-mutations
        name: mutation tables (커밋에 들 판에서 변이 표의 원문이 정확히 한 번 있는지 — tools/mutate.py --staged)
        entry: uv run python tools/mutate.py --staged
        language: system
        pass_filenames: false
        always_run: true
      # 이 가지가 헌법 파일(principles·tech·operations)을 고쳤는데 판이 origin/main 이나 merge-base 의 것과
      # 같으면 막는다. 판정은 커밋에 들 판(색인)이라, 고친 커밋과 판을 올린 커밋을 나누면 앞 커밋이
      # 막힌다. 같은 판정을 tools/sibling_overlap.py 가 작업 트리로 알린다. CI 에는 없다.
      - id: check-constitution-version
        name: constitution version (헌법 파일을 고친 가지가 판을 올렸는지 — tools/check_constitution_version.py)
        entry: uv run python -m tools.check_constitution_version
        language: system
        files: ^docs/constitution/[^/]+\.md$
        pass_filenames: false
      - id: check-quotes
        name: quotes (바뀐 .md가 HEAD에 더한 줄에서 20자 이상 따옴표 인용을 저장소와 대조 — 경고만)
        entry: uv run python tools/check_quotes.py
        language: system
        files: \.md$
        verbose: true
      - id: commit-msg
        name: commit message (conventional commits)
        entry: uv run python tools/check_commit_msg.py
        language: system
        stages: [commit-msg]
