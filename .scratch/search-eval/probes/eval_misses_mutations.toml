# search-eval 06(놓친 까닭, 나눠 본 숫자, `inspect`, `--config`)이 더한 판정의 변이.
# 탈락 지점의 차례(후보 → 합치기 → 리랭크), 낱말 겹침의 분모, 쪽으로 적은 기대 근거의 닿음, 겹침이 없는
# 질의를 0으로 세는 길, 사람 판정의 확인 여부, 유형 표지의 걸러내기, 마지막 단계의 선택, 필터 질의의
# 벡터 후보 판정, 그리고 `--config`가 쓰이는지를 겨눈다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test \
#       uv run python tools/mutate.py .scratch/search-eval/probes/eval_misses_mutations.toml
# 표면 시험이 DB를 쓰는 변이(11, 12)는 한 시험에 1~2분이 든다.
# 빨강의 표지는 시험 파일에 있으면 안 된다(도구가 거른다).

[[mutation]]
name = "합친 순위가 후보 수 밖이어도 리랭커에 들어간 것으로 본다"
tests = ["tests/app/test_eval_misses.py::test_전체_실행에서_합친_순위가_후보_수_밖이면_lost_in_fusion이다"]
expect = "red"
expect_output = ["<MissCause.LOST_IN_RERANK: 'lost_in_rerank'>"]

