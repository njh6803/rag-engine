# search-eval 04(`run --through fused`)가 더한 지표와 유스케이스의 변이.
# 지표의 계산(이득 중복, 1에서 자르기, 이상적 순위의 상한, 적중률의 경계)과 유스케이스의 판정(글귀 적중의
# 문서 일치, 판 전환 거부), 어댑터의 끝점 교체, 스키마가 없는 데이터베이스의 거부를 겨눈다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test \
#       uv run python tools/mutate.py .scratch/search-eval/probes/eval_run_mutations.toml
# 표면 시험이 성공한 실행의 stdout 줄(`보고서를 썼다`)은 시험 파일에 글자 그대로 없어서 표지로 쓴다.
# 빨강의 표지는 시험 파일에 있으면 안 된다(도구가 거른다).

