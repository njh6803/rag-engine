# search-eval 02(묶음 형식과 `validate`의 파일 검사)가 더한 시험의 변이.
# 경계를 지키는 시험("같으면 받는다", "정확히 30MB이면 받는다", "안을 가리키는 링크는 받는다")은
# 구현과 함께 썼고 빨강을 본 적이 없어 변이로 본다. 거부 시험도 판정 하나를 지우는 변이로 그 판정만 겨눈다.
# 실행: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/search-eval/probes/eval_set_validate_mutations.toml
# 빨강의 표지는 엉뚱한 까닭의 빨강을 거르려고 도구가 표준 출력·오류에 내는 글에서 골랐다.
# `문제 없음: `은 거부해야 할 묶음을 받았을 때 도구가 찍는 줄이고, `묶음의 오류 1건`은 받아야 할 묶음을
# 거부했을 때 찍는 줄이다. 시험 파일의 글자가 아니라 도구가 내는 글이다.

