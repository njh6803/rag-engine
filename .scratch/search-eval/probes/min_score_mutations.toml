# 티켓 20(검색의 `min_score`)이 더한 시험의 변이. 시험을 구현과 함께 썼고 변이마다 빨강을 따로 본 적이 없어 변이로 본다.
# 표지는 pytest가 단언이 어긋날 때 찍는 차이 문구다(시험 이름은 늘 실려 표지가 되지 못한다).
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test
#       uv run python tools/mutate.py .scratch/search-eval/probes/min_score_mutations.toml

[[mutation]]
name = "같은 점수의 조각까지 뺀다"
tests = ["tests/app/test_search_min_score.py"]
expect = "red"
expect_output = ['''Right contains one more item: 0.5''']

[[mutation.edit]]
file = "src/rag_engine/app/search.py"
old = '''    return tuple(hit for hit in hits if hit.score >= min_score)'''
new = '''    return tuple(hit for hit in hits if hit.score > min_score)'''

[[mutation]]
name = "RRF 점수로 거른다"
tests = ["tests/app/test_search_min_score.py::test_최소_점수는_리랭크_점수와_맞대고_RRF_점수로는_거르지_않는다"]
expect = "red"
expect_output = ['''Right contains 2 more items, first extra item: 0.5''']

[[mutation.edit]]
