# search-eval 05(`run --through rerank`)가 더한 리랭크 단계와 점수 분포의 변이.
# 리랭크 뒤 순위(점수 순, 같은 점수는 합친 순위 순), 리랭커에 보내는 글(절 경로), 점수 분포의 경계(구간의
# 아래 끝, 문턱 이상), 보고서의 칸과 단계, 끝점이 없는 전체 실행의 거부, 후보 전부를 리랭크하는 것을 겨눈다.
# 표면 시험은 구현 뒤에 썼다. 빨강은 이 표가 구현을 틀리게 했을 때 시험이 실패하는 것으로 확인한다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test \
#       uv run python tools/mutate.py .scratch/search-eval/probes/eval_full_run_mutations.toml
# 빨강의 표지는 시험 파일에 있으면 안 된다(도구가 거른다).

[[mutation]]
name = "리랭크 점수가 같을 때 합친 순위의 역순으로 정한다"
tests = ["tests/app/test_eval_run.py::test_리랭크_뒤는_점수_순이고_점수가_같으면_합친_순위_순이다"]
expect = "red"
expect_output = ["('c', 0.5)"]

