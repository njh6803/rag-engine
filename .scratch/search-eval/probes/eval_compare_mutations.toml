# search-eval 08(`compare`)의 변이.
# 하락폭의 경계(넘을 때만 실패, 오를 때도 같은 경계), 십진수로 빼는 것, 두 지표의 하락폭, 게이트마다
# 보는 단계와 기록 파일(빠른 게이트는 리랭크 기록을 보지 않고 전체 게이트는 본다), 판정 칸 둘을 뺀 구성
# 견줌, 내용 해시, 줄이 없는 보고서의 거부, 기준 보고서의 경로 판정, 보고서 폴더 인자, 갱신 안내와
# 실패 종료 코드, 그리고 `run`의 보고서가 읽지 않은 조각 임베딩 기록 파일의 해시를 싣는 것을 겨눈다.
# 표면 시험(`tests/tools/test_search_eval_compare.py`)과 앱 시험(`tests/app/test_eval_compare.py`)은
# 구현 전에 썼고 모듈이 없다는 이유로 빨갛게 확인했다. 그 빨강은 구현의 까닭이 아니므로 이 표가 구현을
# 틀리게 했을 때 시험이 실패하는 것으로 확인한다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test \
#       uv run python tools/mutate.py .scratch/search-eval/probes/eval_compare_mutations.toml
# 빨강의 표지는 시험 파일에 있으면 안 된다(도구가 거른다).

