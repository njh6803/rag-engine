# search-eval 07(추론 기록)의 변이.
# 열쇠(모델 이름, 질의와 글의 경계), 읽기의 상한(새로 계산한 임베딩 100개)과 그 경계, 쓰기의 조건(종료
# 코드 0, 주인 파일, 요청 지문과 TEI 판이 다른 파일의 옛 값), `read`가 파일을 고치지 않는 것, 문서가 든
# 데이터베이스에서의 `index --records write`, 리랭커 끝점의 필수 여부, 보고서의 `records` 칸, `validate`의
# 기록 판정(크기, 요청 지문, TEI 판, compose 태그의 장치 머리)을 겨눈다.
# 표면 시험(`tests/tools/test_search_eval_records.py`)은 구현 전에 썼고 인자가 없다는 이유로 빨갛게 확인했다.
# 그 빨강은 구현의 까닭이 아니므로, 이 표가 구현을 틀리게 했을 때 시험이 실패하는 것으로 확인한다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test \
#       uv run python tools/mutate.py .scratch/search-eval/probes/eval_records_mutations.toml
# 빨강의 표지는 시험 파일에 있으면 안 된다(도구가 거른다).

