# search-eval 12(`judge`, Claude 판정기, 보고서의 `llm`)가 더한 판정 쌍 고르기, 숫자의 분모, 판정 파일,
# 판정기 어댑터의 실패 갈래, `judge`의 순서를 겨눈다. 표면 시험은 구현 전에 썼고, 빨강은 이 표가 구현을
# 틀리게 했을 때 시험이 실패하는 것으로 확인한다. 처음 돌았을 때 16번(길이 한도 검사)과 23번(상위 열 개)이
# 초록으로 지나가 시험의 빈틈을 알렸고, 시험을 고친 뒤 빨강이 되는 것을 이 표로 확인했다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test \
#       uv run python tools/mutate.py .scratch/search-eval/probes/eval_judge_mutations.toml
# 빨강의 표지는 시험 파일에 있으면 안 된다(도구가 거른다). 표지 가운데 `<파일>.py:<줄>: AssertionError`는
# 그 단언의 줄이라, 시험 파일의 그 줄이 움직이면 다시 고른다.

