# search-eval 11(`tools/eval_gate_paths.py`, 빠른 게이트의 경로 판정)의 변이.
# 푸시와 수동 실행이 경로를 보지 않는 것, PR 에서 바뀐 경로를 읽지 못하거나 비었을 때와 알지 못하는 이벤트의 닫힘,
# 폴더 항목의 접두 경계(`srcs/`), 이름 바꾸기 찾기를 끄는 `--no-renames`, merge-base 부터 읽는 것, `-z` 로 받는
# 한글 경로를 겨눈다. 시험(`tests/tools/test_eval_gate_paths.py`)은 구현 전에 썼고 모듈이 없다는 이유로 빨갛게
# 확인했다. 그 빨강은 구현의 까닭이 아니므로 이 표가 구현을 틀리게 했을 때 시험이 실패하는 것으로 확인한다.
# 실행: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/search-eval/probes/eval_gate_paths_mutations.toml
# 빨강의 표지는 시험 파일에 있으면 안 된다(도구가 거른다).

[[mutation]]
name = "푸시도 바뀐 경로를 보고 가른다"
tests = ["tests/tools/test_eval_gate_paths.py"]
expect = "red"
expect_output = ["assert False is True"]

[[mutation.edit]]
file = "tools/eval_gate_paths.py"
old = '''    if event_name != PULL_REQUEST:
'''
new = '''    if event_name != PULL_REQUEST and event_name not in ALWAYS_EVENTS:
'''

[[mutation]]
name = "PR 에서 바뀐 경로를 읽지 못했거나 비었으면 평가하지 않는다"
tests = ["tests/tools/test_eval_gate_paths.py"]
expect = "red"
expect_output = ["assert False is True"]

[[mutation.edit]]
file = "tools/eval_gate_paths.py"
old = '''        return True, "PR 에서 바뀐 경로를 읽지 못했거나 비어 있어 평가한다"'''
new = '''        return False, "PR 에서 바뀐 경로를 읽지 못했거나 비어 있어 평가한다"'''

[[mutation]]
name = "알지 못하는 이벤트는 평가하지 않는다"
tests = ["tests/tools/test_eval_gate_paths.py"]
expect = "red"
expect_output = ["assert False is True"]

[[mutation.edit]]
file = "tools/eval_gate_paths.py"
old = '''        return True, f"알지 못하는 이벤트({event_name or '빈 값'})라 평가한다"'''
new = '''        return False, f"알지 못하는 이벤트({event_name or '빈 값'})라 평가한다"'''

[[mutation]]
name = "푸시의 이유 문구가 알지 못하는 이벤트의 것으로 나간다"
