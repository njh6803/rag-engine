# search-eval 03(`index`와 `validate --indexed`)이 더한 시험의 변이.
# 가드(소속 판정, 요소 판정, 스키마를 올리기 전의 판정, 이름의 규칙, 설정 격리, 글귀의 정규화와 제목 제외)는
# 구현과 함께 시험을 썼고 빨강을 본 적이 없어 변이로 본다. 판정 하나를 지우거나 비트는 변이로 그 판정만 겨눈다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test \
#       uv run python tools/mutate.py .scratch/search-eval/probes/eval_index_mutations.toml
# 시험 하나마다 PostgreSQL을 쓰므로 변이가 겨누는 시험만 `::`로 골라 돌린다.
# 빨강의 표지는 시험 파일에 글자 그대로 있으면 안 된다(도구가 거른다). 그래서 거부해야 할 것을 받았을 때
# 도구가 찍는 줄(`updated`·`unchanged` 같은 수집 결과 줄, `문제 없음: `)이나 받아야 할 것을 거부했을 때
# 찍는 줄(`묶음의 오류 1건`)에서 골랐다. 표지의 탭은 수집 결과 줄이 `<동작><탭><키>`이기 때문이다.

