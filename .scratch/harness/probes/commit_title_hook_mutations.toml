# commit-title-check-before-slow-checks(harness 티켓)가 `tools/hook_bash_commit_msg.py` 에 더한 길(`-m`,
# `cd` 복합 명령, `-F -` heredoc, `-m "$(cat <<'EOF' …)"`)의 시험이 무엇을 재는지 보는 변이.
# 시험을 먼저 쓰고 구현했으므로 구현 전부터 초록인 가드가 아니라는 것은 첫 실행으로 본다. 새 갈래를 깨어
# 빨강을 본다.
# 실행: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/commit_title_hook_mutations.toml
# 변이마다 그 갈래를 고정한 시험 하나만 돈다.

