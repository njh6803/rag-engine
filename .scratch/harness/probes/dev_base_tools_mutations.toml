# dev-branch 01(기준 브랜치 규칙을 도구·훅·커밋 검사에 싣는다)이 agent-os 전환 diff와 함께 얹은 시험의 변이.
# 시험이 구현보다 먼저 초록이라(diff를 얹었다) 새 갈래를 깨어 빨강을 본다.
# 실행: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/harness/probes/dev_base_tools_mutations.toml
# 변이마다 그 갈래를 고정한 시험 하나만 돈다(파일 전체는 git을 시험마다 띄워 수 분이 걸린다).
# 이 표는 agent-os의 변이 파일을 옮긴 것이 아니라 이 저장소에서 새로 지었다.

