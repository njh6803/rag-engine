# source-sync 13(문서 되살리기)의 시험이 되살림의 자리마다 빨개지는지 본다. 거절 둘(종류, 지워지지
# 않은 문서), 원천 행의 공유 잠금과 지움 표시 확인(둘을 함께 빼는 변이 하나, 잠금만 빼는 변이 하나),
# 원천과 함께 지워졌다는 표시 풀기, 세대, 건너뜀 갈래, 건설 중인 판의 `pending`, 보관 조각 지우기,
# 응답의 작업 식별자, 잠근 뒤에 그룹에 붙은 지식베이스의 판을 하나씩 깨뜨린다.
