# source-sync 12(원천 되살리기)의 시험이 되살리기의 각 판정을 하나씩 지켜 보는지 본다. 진행 중인
# 작업 검사, 보관 기간 검사, 작업의 지움 표시 재확인, 원천과 함께 지웠다는 표시로 문서를 고르는 자리,
