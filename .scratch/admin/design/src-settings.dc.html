<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>원천 하나: 설정</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important} a{color:var(--accent)} a:hover{color:var(--text)}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--text); font-family: var(--sans);">
<div style="flex: 0 0 var(--spacing-nav); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: var(--spacing-4); padding: var(--spacing-4) var(--spacing-3); background: var(--bg-raised); border-right: 1px solid var(--border);">
<dc-import name="cmp-nav" current="sources" admin="{{ yes }}" hint-size="232px,320px"></dc-import>
<dc-import name="cmp-account" account="ops-lead" role="시스템 관리자" menu-open="{{ no }}" hint-size="232px,60px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: var(--spacing-8);">
<div style="max-width: 1040px; display: flex; flex-direction: column; gap: var(--spacing-6);">
<div class="flex flex-col gap-3">
<a href="src-list.dc.html" class="flex items-center gap-1 text-body" style="width: fit-content; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="m15 18-6-6 6-6"></path></svg>원천 목록</a>
<header class="flex items-start justify-between gap-4 flex-wrap">
<div class="flex flex-col gap-1 min-w-0">
<div class="flex items-center gap-3"><h1 class="font-mono" style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">nas-manuals</h1><dc-import name="cmp-badge" state="failed" hint-size="52px,22px"></dc-import></div>
<p class="text-body text-text-muted" style="margin: 0;">서버가 매일 02:00에 폴더 manuals를 읽어 옵니다.</p>
</div>
<div class="flex items-center gap-2 shrink-0">
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary">지금 동기화</x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">일시 중지</x-import>
<x-import component-from-global-scope="AgentOsUi.IconButton" icon="ellipsis" label="nas-manuals의 동작" variant="secondary"></x-import>
</div>
</header>
</div>

<div role="tablist" aria-label="원천 보기" class="flex gap-4" style="border-bottom: 1px solid var(--border);">
<a href="src-detail.dc.html" role="tab" aria-selected="false" class="text-body flex items-center" style="height: var(--control-h); padding: 0 var(--spacing-1); margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--text-muted); text-decoration: none;">동기화 기록</a>
<button type="button" role="tab" aria-selected="true" class="text-body font-medium" style="height: var(--control-h); padding: 0 var(--spacing-1); margin-bottom: -1px; border: 0; border-bottom: 2px solid var(--accent); background: transparent; color: var(--text); font-family: inherit; font-weight: var(--font-weight-medium); cursor: pointer;">설정</button>
</div>

<form class="flex flex-col" style="gap: var(--spacing-6); max-width: 640px; margin: 0;" onsubmit="return false;">
<dl class="flex flex-wrap text-body" style="margin: 0; border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised);">
<div class="flex flex-col gap-1" style="min-width: 0; padding: var(--spacing-3) var(--spacing-4); border-right: 1px solid var(--border);"><dt class="text-small text-text-muted">이름</dt><dd class="font-mono text-mono" style="margin: 0;">nas-manuals</dd></div>
<div class="flex flex-col gap-1" style="min-width: 0; padding: var(--spacing-3) var(--spacing-4);"><dt class="text-small text-text-muted">종류</dt><dd style="margin: 0;">서버 폴더</dd></div>
</dl>
<p class="text-small text-text-muted" style="margin: calc(var(--spacing-4) * -1) 0 0;">이름과 종류는 원천을 만든 뒤에 바꿀 수 없습니다.</p>

<div class="flex flex-col gap-1">
<span id="folder-label" class="text-body font-medium">폴더</span>
<div class="flex items-center gap-2 flex-wrap">
<div aria-labelledby="folder-label" class="flex items-center gap-2 font-mono text-mono" style="flex: 1 1 280px; box-sizing: border-box; height: var(--control-h); padding: 0 var(--spacing-3) 2px; border: 1px solid var(--border-control); border-radius: var(--radius-m); background: var(--bg-raised);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: var(--text-muted);"><path vector-effect="non-scaling-stroke" d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>manuals</div>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">폴더 고르기</x-import>
</div>
<span class="text-small text-text-muted">서버에 정해 둔 원천 폴더 아래의 폴더입니다.</span>
</div>

<x-import component-from-global-scope="AgentOsUi.TextField" label="그룹" value="engineering" help="이 원천이 가져온 문서가 속하는 그룹입니다. 접근 그룹을 쓰는 설치에서는 이 그룹에 연결된 접근 그룹만 문서를 봅니다."></x-import>

<x-import component-from-global-scope="AgentOsUi.TextField" variant="multi" rows="4" label="제외 패턴" optional="{{ yes }}" value="**/~$*&#10;**/임시/**&#10;*.tmp" help="한 줄에 하나씩 씁니다. 경로나 이름이 맞는 파일은 받지 않습니다."></x-import>

<dc-import name="cmp-schedule" mode="daily" hint-size="100%,320px"></dc-import>

<div class="flex items-center gap-3 flex-wrap" style="padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">저장</x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">되돌리기</x-import>
<span class="text-small text-text-muted">바꾼 설정은 다음 동기화부터 씁니다.</span>
</div>
</form>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 960}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false };
  }
}
</script>
</body>
</html>
