<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>발급한 토큰 값 창</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);">
<dc-import name="fx-tokens" menu-open="{{ no }}" hint-size="100%,760px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--text); opacity: 0.32;"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--spacing-4);">
<dialog open aria-labelledby="issued-title" class="shadow-float" style="position: static; box-sizing: border-box; width: 100%; max-width: 480px; margin: 0; padding: var(--spacing-6); border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised); color: var(--text); display: flex; flex-direction: column; gap: var(--spacing-6);">
<h2 id="issued-title" class="text-body font-semibold" style="margin: 0;"><span class="font-mono">claude-desktop-team</span> 토큰을 발급했습니다</h2>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="warning" title="이 값은 지금 한 번만 보입니다"><p class="text-body" style="margin: 0;">서버는 토큰의 해시만 둡니다. 창을 닫기 전에 복사해 프로그램 설정에 넣으세요. 잃으면 회수하고 새로 발급합니다.</p></x-import>
<div class="flex items-start gap-2" style="padding: var(--spacing-3); border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--bg);">
<code class="font-mono text-mono" style="flex: 1; min-width: 0; overflow-wrap: anywhere;">rag_Jk9mQx2vP7tL0wZ…</code>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">복사</x-import>
</div>
<div class="flex flex-col gap-1">
<p class="text-small text-text-muted" style="margin: 0;">역할 <span class="font-mono text-mono">reader</span>, 지식베이스 전부, 만료 없음</p>
<p class="text-small text-text-muted" style="margin: 0;">MCP 클라이언트에는 머리 <code class="font-mono text-mono">Authorization: Bearer &lt;토큰&gt;</code>으로 넣습니다.</p>
</div>
<div class="flex items-center gap-2" style="justify-content: flex-end; padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">닫기</x-import>
</div>
</dialog>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 760}}'>
class Component extends DCLogic {
  renderVals() {
    return { no: false };
  }
}
</script>
</body>
</html>
