<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>부품: 비밀번호 규칙 목록</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<ul data-theme="nokcheong" data-mode="light" aria-label="비밀번호 규칙" class="flex flex-col gap-1" style="list-style: none; margin: 0; padding: 0; background: transparent; color: var(--text); font-family: var(--sans);">
<li class="flex items-center gap-2 text-small" style="min-height: 24px;"><span style="color: var(--success); display: inline-flex;"><x-import component-from-global-scope="AgentOsUi.Icon" name="check" size="16"></x-import></span><span>8자 이상</span><span class="text-text-muted">맞음</span></li>
<li class="flex items-center gap-2 text-small" style="min-height: 24px;"><span style="color: var(--success); display: inline-flex;"><x-import component-from-global-scope="AgentOsUi.Icon" name="check" size="16"></x-import></span><span>영문 대문자 1자 이상</span><span class="text-text-muted">맞음</span></li>
<li class="flex items-center gap-2 text-small" style="min-height: 24px;"><span style="color: var(--success); display: inline-flex;"><x-import component-from-global-scope="AgentOsUi.Icon" name="check" size="16"></x-import></span><span>숫자 1자 이상</span><span class="text-text-muted">맞음</span></li>
<sc-if value="{{ is.met }}" hint-placeholder-val="{{ false }}"><li class="flex items-center gap-2 text-small" style="min-height: 24px;"><span style="color: var(--success); display: inline-flex;"><x-import component-from-global-scope="AgentOsUi.Icon" name="check" size="16"></x-import></span><span>특수문자 1자 이상</span><span class="text-text-muted">맞음</span></li></sc-if>
<sc-if value="{{ is.pending }}" hint-placeholder-val="{{ true }}"><li class="flex items-center gap-2 text-small" style="min-height: 24px;"><span style="color: var(--text-muted); display: inline-flex;"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle" size="16"></x-import></span><span class="text-text-muted">특수문자 1자 이상</span></li></sc-if>
<sc-if value="{{ is.failed }}" hint-placeholder-val="{{ false }}"><li class="flex items-center gap-2 text-small" style="min-height: 24px;"><span style="color: var(--danger); display: inline-flex;"><x-import component-from-global-scope="AgentOsUi.Icon" name="circle-x" size="16"></x-import></span><span>특수문자 1자 이상</span><span style="color: var(--danger);">못 맞춤</span></li></sc-if>
</ul>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"special": {"editor": "enum", "options": ["pending", "met", "failed"], "default": "pending"}, "$preview": {"width": 360, "height": 120}}'>
class Component extends DCLogic {
  renderVals() {
    const special = this.props.special ?? 'pending';
    return { is: { pending: special === 'pending', met: special === 'met', failed: special === 'failed' } };
  }
}
</script>
</body>
</html>
