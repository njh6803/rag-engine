<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>운영자 계정</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important} a{color:var(--accent)} a:hover{color:var(--text)}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--text); font-family: var(--sans);">
<div style="flex: 0 0 var(--spacing-nav); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: var(--spacing-4); padding: var(--spacing-4) var(--spacing-3); background: var(--bg-raised); border-right: 1px solid var(--border);">
<dc-import name="cmp-nav" current="accounts" admin="{{ yes }}" hint-size="232px,320px"></dc-import>
<dc-import name="cmp-account" account="ops-lead" role="시스템 관리자" menu-open="{{ no }}" hint-size="232px,60px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: var(--spacing-8);">
<div style="max-width: 1040px; display: flex; flex-direction: column; gap: var(--spacing-6);">
<header class="flex items-start justify-between gap-4 flex-wrap">
<div class="flex flex-col gap-1 min-w-0" style="max-width: 680px;">
<div class="flex items-center gap-2"><h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">운영자 계정</h1><span class="text-body text-text-muted">5</span></div>
<p class="text-body text-text-muted" style="margin: 0;">관리자 페이지에 로그인하는 계정을 만들고 막습니다. 시스템 관리자에게만 보입니다.</p>
</div>
<div class="flex items-center gap-2 shrink-0">
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary">새로 고침</x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary">계정 만들기</x-import>
</div>
</header>

<div class="flex"><x-import component-from-global-scope="AgentOsUi.Switch" label="비활성 계정도 보기" checked="{{ no }}"></x-import></div>

<div style="overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised);">
<table class="w-full text-table" aria-label="운영자 계정" style="border-collapse: collapse;">
<thead><tr style="border-bottom: 1px solid var(--border); background: var(--bg);">
<th scope="col" class="text-small font-medium text-text-muted" style="height: var(--row-h); padding: 0 var(--spacing-3); text-align: left; white-space: nowrap;">계정 이름</th>
<th scope="col" class="text-small font-medium text-text-muted" style="height: var(--row-h); padding: 0 var(--spacing-3); text-align: left; white-space: nowrap;">단계</th>
<th scope="col" class="text-small font-medium text-text-muted" style="height: var(--row-h); padding: 0 var(--spacing-3); text-align: left; white-space: nowrap;">상태</th>
<th scope="col" class="text-small font-medium text-text-muted" style="height: var(--row-h); padding: 0 var(--spacing-3); text-align: left; white-space: nowrap;">만든 시각</th>
<th scope="col" style="width: 48px;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">동작</span></th>
</tr></thead>
<tbody>
<tr style="border-bottom: 1px solid var(--border);"><td style="height: var(--row-h); padding: 0 var(--spacing-3);"><span class="font-mono text-mono">ops-lead</span> <span class="text-small text-text-muted">지금 계정</span></td><td style="padding: 0 var(--spacing-3);">시스템 관리자</td><td style="padding: 0 var(--spacing-3);"><dc-import name="cmp-badge" state="active" hint-size="52px,22px"></dc-import></td><td style="padding: 0 var(--spacing-3);"><span class="font-mono text-mono text-text-muted">2026-11-02 10:00</span></td><td></td></tr>
<tr style="border-bottom: 1px solid var(--border);"><td style="height: var(--row-h); padding: 0 var(--spacing-3);"><span class="font-mono text-mono">kim.dev</span></td><td style="padding: 0 var(--spacing-3);">관리자</td><td style="padding: 0 var(--spacing-3);"><dc-import name="cmp-badge" state="active" hint-size="52px,22px"></dc-import></td><td style="padding: 0 var(--spacing-3);"><span class="font-mono text-mono text-text-muted">2026-11-03 09:12</span></td><td style="padding: 0 var(--spacing-1); text-align: right;"><x-import component-from-global-scope="AgentOsUi.IconButton" icon="ellipsis" label="kim.dev의 동작" size="s"></x-import></td></tr>
<tr style="border-bottom: 1px solid var(--border);"><td style="height: var(--row-h); padding: 0 var(--spacing-3);"><span class="font-mono text-mono">park.sre</span></td><td style="padding: 0 var(--spacing-3);">관리자</td><td style="padding: var(--spacing-1) var(--spacing-3);"><div class="flex items-center gap-2 flex-wrap"><dc-import name="cmp-badge" state="active" hint-size="52px,22px"></dc-import><x-import component-from-global-scope="AgentOsUi.AccountStatusBadge" status="locked"></x-import><span class="font-mono text-mono text-small text-text-muted">15:42까지</span></div></td><td style="padding: 0 var(--spacing-3);"><span class="font-mono text-mono text-text-muted">2026-11-05 14:30</span></td><td style="position: relative; padding: 0 var(--spacing-1); text-align: right;"><x-import component-from-global-scope="AgentOsUi.IconButton" icon="ellipsis" label="park.sre의 동작" size="s"></x-import>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="park.sre의 동작" class="shadow-float flex flex-col" style="position: absolute; bottom: calc(100% - var(--spacing-1)); right: var(--spacing-2); z-index: 3; min-width: 200px; padding: var(--spacing-1); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-m); text-align: left;">
<button type="button" role="menuitem" class="text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 0; border-radius: var(--radius-s); background: var(--bg-hover); color: var(--text); font-family: inherit; text-align: left; cursor: pointer;">비밀번호 링크 만들기</button>
<button type="button" role="menuitem" class="text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 0; border-radius: var(--radius-s); background: transparent; color: var(--text); font-family: inherit; text-align: left; cursor: pointer;">잠금 풀기</button>
<div role="separator" style="height: 1px; margin: var(--spacing-1) 0; background: var(--border);"></div>
<button type="button" role="menuitem" class="text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 0; border-radius: var(--radius-s); background: transparent; color: var(--text); font-family: inherit; text-align: left; cursor: pointer;">비활성으로 바꾸기</button>
</div>
</sc-if>
</td></tr>
<tr style="border-bottom: 1px solid var(--border);"><td style="height: var(--row-h); padding: 0 var(--spacing-3);"><span class="font-mono text-mono">lee.qa</span></td><td style="padding: 0 var(--spacing-3);">관리자</td><td style="padding: 0 var(--spacing-3);"><x-import component-from-global-scope="AgentOsUi.AccountStatusBadge" status="password-unset"></x-import></td><td style="padding: 0 var(--spacing-3);"><span class="font-mono text-mono text-text-muted">2026-11-26 15:18</span></td><td style="padding: 0 var(--spacing-1); text-align: right;"><x-import component-from-global-scope="AgentOsUi.IconButton" icon="ellipsis" label="lee.qa의 동작" size="s"></x-import></td></tr>
<tr><td style="height: var(--row-h); padding: 0 var(--spacing-3);"><span class="font-mono text-mono">choi.ml</span></td><td style="padding: 0 var(--spacing-3);">관리자</td><td style="padding: 0 var(--spacing-3);"><dc-import name="cmp-badge" state="active" hint-size="52px,22px"></dc-import></td><td style="padding: 0 var(--spacing-3);"><span class="font-mono text-mono text-text-muted">2026-11-10 11:05</span></td><td style="padding: 0 var(--spacing-1); text-align: right;"><x-import component-from-global-scope="AgentOsUi.IconButton" icon="ellipsis" label="choi.ml의 동작" size="s"></x-import></td></tr>
</tbody>
</table>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"menuOpen": {"editor": "boolean", "default": true}, "$preview": {"width": 1280, "height": 760}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, menuOpen: this.props.menuOpen ?? true };
  }
}
</script>
</body>
</html>
