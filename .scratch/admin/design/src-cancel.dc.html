<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>동기화 취소 확인 창</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);">
<dc-import name="src-running" hint-size="100%,780px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--text); opacity: 0.32;"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--spacing-4);">
<dialog open aria-labelledby="cancel-title" class="shadow-float" style="position: static; box-sizing: border-box; width: 100%; max-width: 480px; margin: 0; padding: var(--spacing-6); border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised); color: var(--text); display: flex; flex-direction: column; gap: var(--spacing-6);">
<h2 id="cancel-title" class="text-body font-semibold" style="margin: 0;">동기화를 취소합니다</h2>
<p class="text-body" style="margin: 0;"><span class="font-mono text-mono">nas-handbook</span>의 동기화를 멈춥니다. 이미 반영된 문서는 그대로 남습니다. 아직 살피지 않은 파일 56개는 다음 동기화가 읽습니다.</p>
<p class="text-small text-text-muted" style="margin: 0;">이번 동기화는 취소됨으로 기록에 남습니다. 다음 일정 <span class="font-mono text-mono">11-27 00:00</span>에는 그대로 동기화합니다.</p>
<div class="flex items-center gap-2 flex-wrap" style="justify-content: flex-end; padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">계속하기</x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="button">동기화 취소</x-import>
</div>
</dialog>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
