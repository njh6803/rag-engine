<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 비밀번호 바꾸기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--text); font-family: var(--sans);">
<div style="flex: 0 0 var(--spacing-nav); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: var(--spacing-4); padding: var(--spacing-4) var(--spacing-3); background: var(--bg-raised); border-right: 1px solid var(--border);">
<dc-import name="cmp-nav" current="none" admin="{{ no }}" hint-size="232px,320px"></dc-import>
<dc-import name="cmp-account" account="kim.dev" role="관리자" menu-open="{{ no }}" hint-size="232px,60px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: var(--spacing-8);">
<div style="max-width: 1040px; display: flex; flex-direction: column; gap: var(--spacing-6);">
<header class="flex flex-col gap-1" style="max-width: 680px;">
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">비밀번호 바꾸기</h1>
<p class="text-body text-text-muted" style="margin: 0;"><span class="font-mono text-mono">kim.dev</span>의 비밀번호를 바꿉니다.</p>
</header>
<div style="max-width: 440px;">
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<form class="flex flex-col" style="gap: var(--spacing-6); margin: 0; padding: var(--spacing-2);" onsubmit="return false;">
<x-import component-from-global-scope="AgentOsUi.TextField" label="지금 비밀번호" type="password" value="Xxxxxxx0" error="지금 비밀번호가 맞지 않습니다."></x-import>
<div class="flex flex-col gap-2">
<x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호" type="password" value="Xxxxxxx1!"></x-import>
<dc-import name="cmp-pw-rules" special="met" hint-size="100%,112px"></dc-import>
</div>
<x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호 다시" type="password" value="Xxxxxxx1!"></x-import>
<p class="text-small text-text-muted" style="margin: 0;">바꾸면 이 계정의 다른 곳 로그인은 길어야 5분 안에 끊깁니다. 이 브라우저의 로그인은 그대로입니다.</p>
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">바꾸기</x-import>
</form>
</x-import>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false };
  }
}
</script>
</body>
</html>
