<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일정 고르기의 상태</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="box-sizing: border-box; min-height: 560px; padding: var(--spacing-8); background: var(--bg); color: var(--text); font-family: var(--sans);">
<div style="display: grid; gap: var(--spacing-6); grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));">
<section class="flex flex-col gap-3">
<h2 class="text-small font-medium text-text-muted" style="margin: 0;">매주를 골랐을 때</h2>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4"><dc-import name="cmp-schedule" mode="weekly" hint-size="100%,320px"></dc-import></x-import>
</section>
<section class="flex flex-col gap-3">
<h2 class="text-small font-medium text-text-muted" style="margin: 0;">직접 쓴 표현이 맞을 때</h2>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4"><dc-import name="cmp-schedule" mode="cron" hint-size="100%,400px"></dc-import></x-import>
</section>
<section class="flex flex-col gap-3">
<h2 class="text-small font-medium text-text-muted" style="margin: 0;">직접 쓴 표현이 틀렸을 때</h2>
<x-import component-from-global-scope="AgentOsUi.Card" padding="4"><dc-import name="cmp-schedule" mode="cron-error" hint-size="100%,360px"></dc-import></x-import>
<p class="text-small text-text-muted" style="margin: 0;">표현이 틀린 동안에는 풀이 줄이 사라지고 저장 버튼이 막힙니다.</p>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 560}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
