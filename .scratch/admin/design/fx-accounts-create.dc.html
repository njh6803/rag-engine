<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계정 만들기 창</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);">
<dc-import name="fx-accounts" menu-open="{{ no }}" hint-size="100%,760px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--text); opacity: 0.32;"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--spacing-4);">
<dialog open aria-labelledby="create-title" class="shadow-float" style="position: static; box-sizing: border-box; width: 100%; max-width: 480px; margin: 0; padding: var(--spacing-6); border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised); color: var(--text); display: flex; flex-direction: column; gap: var(--spacing-6);">
<h2 id="create-title" class="text-body font-semibold" style="margin: 0;">계정 만들기</h2>
<div class="flex flex-col gap-2">
<x-import component-from-global-scope="AgentOsUi.TextField" label="계정 이름" value="kim.dev" error="이 이름의 계정이 있습니다(비활성 계정 포함)."></x-import>
<p class="text-small text-text-muted" style="margin: 0;">영문 소문자, 숫자, . _ - 로 3~32자입니다. 영문자나 숫자로 시작합니다. 한 번 쓴 이름은 다시 쓸 수 없습니다.</p>
</div>
<div class="flex flex-col gap-2">
<span class="text-small font-medium">단계</span>
<div class="text-body flex items-center" style="box-sizing: border-box; height: var(--control-h); padding: 0 var(--spacing-3) 2px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--bg); color: var(--text-muted);">관리자</div>
</div>
<div class="flex items-center gap-2 flex-wrap" style="justify-content: flex-end; padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">취소</x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="button">만들기</x-import>
</div>
</dialog>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 760}}'>
class Component extends DCLogic {
  renderVals() {
    return { no: false };
  }
}
</script>
</body>
</html>
