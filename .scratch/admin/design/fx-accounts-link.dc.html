<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비밀번호 링크 창</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);">
<dc-import name="fx-accounts" menu-open="{{ no }}" hint-size="100%,760px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--text); opacity: 0.32;"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--spacing-4);">
<dialog open aria-labelledby="link-title" class="shadow-float" style="position: static; box-sizing: border-box; width: 100%; max-width: 480px; margin: 0; padding: var(--spacing-6); border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised); color: var(--text); display: flex; flex-direction: column; gap: var(--spacing-6);">
<h2 id="link-title" class="text-body font-semibold" style="margin: 0;"><span class="font-mono">lee.qa</span>의 비밀번호 링크</h2>
<p class="text-body" style="margin: 0;">이 링크를 <span class="font-mono text-mono">lee.qa</span>에게 직접 전하세요. 메일은 보내지 않습니다.</p>
<div class="flex items-start gap-2" style="padding: var(--spacing-3); border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--bg);">
<code class="font-mono text-mono" style="flex: 1; min-width: 0; overflow-wrap: anywhere;">https://rag.example.com:8443/set-password#7Hq2kV9xPm…</code>
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">복사</x-import>
</div>
<div class="flex flex-col gap-1">
<p class="text-small text-text-muted" style="margin: 0;">한 번만 쓰입니다. <span class="font-mono text-mono">2026-11-27 15:18</span>에 끝납니다(만든 뒤 24시간).</p>
<p class="text-small text-text-muted" style="margin: 0;">다시 만들면 이 링크는 쓸 수 없습니다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.Alert" tone="info" title="이 창을 닫으면 링크를 다시 볼 수 없습니다"><p class="text-body" style="margin: 0;">서버는 링크를 기억하지 않습니다. 잃으면 새로 만드세요.</p></x-import>
<div class="flex items-center gap-2" style="justify-content: flex-end; padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">닫기</x-import>
</div>
</dialog>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 760}}'>
class Component extends DCLogic {
  renderVals() {
    return { no: false };
  }
}
</script>
</body>
</html>
