<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>토큰 발급 창</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);">
<dc-import name="fx-tokens" menu-open="{{ no }}" hint-size="100%,800px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--text); opacity: 0.32;"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--spacing-4);">
<dialog open aria-labelledby="issue-title" class="shadow-float" style="position: static; box-sizing: border-box; width: 100%; max-width: 480px; margin: 0; padding: var(--spacing-6); border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised); color: var(--text); display: flex; flex-direction: column; gap: var(--spacing-6);">
<h2 id="issue-title" class="text-body font-semibold" style="margin: 0;">토큰 발급</h2>
<x-import component-from-global-scope="AgentOsUi.TextField" label="이름" value="claude-desktop-team" help="어느 프로그램에 준 토큰인지 알아볼 수 있게 짓습니다."></x-import>
<fieldset class="flex flex-col gap-2" style="margin: 0; padding: 0; border: 0; min-width: 0;">
<legend class="text-body font-medium" style="padding: 0; margin-bottom: var(--spacing-2);">역할</legend>
<label class="flex items-start gap-3" style="padding: var(--spacing-3); border: 1px solid var(--accent); border-radius: var(--radius-m); background: var(--bg-selected); cursor: pointer;"><input type="radio" name="role" checked style="margin: 3px 0 0; accent-color: var(--accent);"><span class="flex flex-col gap-1"><span class="font-mono text-mono font-medium">reader</span><span class="text-small text-text-muted">AI 클라이언트가 MCP의 검색 도구만 부릅니다.</span></span></label>
<label class="flex items-start gap-3" style="padding: var(--spacing-3); border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--bg); cursor: pointer;"><input type="radio" name="role" style="margin: 3px 0 0; accent-color: var(--accent);"><span class="flex flex-col gap-1"><span class="font-mono text-mono font-medium">admin</span><span class="text-small text-text-muted">관리 API, 수집 API, MCP를 모두 부릅니다. 문서를 보내는 시스템과 스크립트에 줍니다.</span></span></label>
</fieldset>
<div class="flex flex-col gap-1">
<label class="flex flex-col gap-1 text-body font-medium">지식베이스<select class="text-body" style="height: var(--control-h); padding: 0 var(--spacing-3); border: 1px solid var(--border-control); border-radius: var(--radius-m); background: var(--bg); color: var(--text); font-weight: normal;"><option>전부</option><option>default</option></select></label>
<p class="text-small text-text-muted" style="margin: 0;">reader가 검색할 지식베이스입니다. 지금은 <span class="font-mono text-mono">default</span> 하나입니다.</p>
</div>
<x-import component-from-global-scope="AgentOsUi.TextField" label="만료 시각" optional="{{ yes }}" placeholder="예: 2027-05-31 00:00" help="비우면 회수할 때까지 씁니다."></x-import>
<div class="flex items-center gap-2 flex-wrap" style="justify-content: flex-end; padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">취소</x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="button">발급</x-import>
</div>
</dialog>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 800}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false };
  }
}
</script>
</body>
</html>
