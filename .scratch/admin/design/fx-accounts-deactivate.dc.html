<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계정 비활성 창</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);">
<dc-import name="fx-accounts" menu-open="{{ no }}" hint-size="100%,760px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--text); opacity: 0.32;"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--spacing-4);">
<dialog open aria-labelledby="deactivate-title" class="shadow-float" style="position: static; box-sizing: border-box; width: 100%; max-width: 480px; margin: 0; padding: var(--spacing-6); border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised); color: var(--text); display: flex; flex-direction: column; gap: var(--spacing-6);">
<h2 id="deactivate-title" class="text-body font-semibold" style="margin: 0;"><span class="font-mono">choi.ml</span>을 비활성으로 바꿉니다</h2>
<ul class="text-body flex flex-col gap-2" style="margin: 0; padding-left: var(--spacing-6);">
<li>이 계정의 로그인은 길어야 5분 안에 모두 끊깁니다.</li>
<li>이 이름으로 새 계정을 만들 수 없습니다.</li>
<li>로그인 기록에 남은 이름은 그대로입니다.</li>
<li>언제든 활성으로 되돌릴 수 있습니다.</li>
</ul>
<div class="flex items-center gap-2 flex-wrap" style="justify-content: flex-end; padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">취소</x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="danger" type="button">비활성으로 바꾸기</x-import>
</div>
</dialog>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 760}}'>
class Component extends DCLogic {
  renderVals() {
    return { no: false };
  }
}
</script>
</body>
</html>
