<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지금 동기화 창</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans);">
<dc-import name="src-detail" hint-size="100%,780px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--text); opacity: 0.32;"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--spacing-4);">
<dialog open aria-labelledby="sync-title" class="shadow-float" style="position: static; box-sizing: border-box; width: 100%; max-width: 480px; margin: 0; padding: var(--spacing-6); border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--bg-raised); color: var(--text); display: flex; flex-direction: column; gap: var(--spacing-6);">
<h2 id="sync-title" class="text-body font-semibold" style="margin: 0;"><span class="font-mono">nas-manuals</span>를 지금 동기화합니다</h2>
<p class="text-body" style="margin: 0;">폴더 <span class="font-mono text-mono">manuals</span>를 지금 읽어 바뀐 문서를 반영합니다. 보통은 수정 시각이나 크기가 바뀐 파일만 다시 읽습니다.</p>
<div class="flex flex-col gap-3">
<label class="flex items-start gap-3" style="cursor: pointer;"><input type="checkbox" style="margin: 3px 0 0; accent-color: var(--accent);"><span class="flex flex-col gap-1"><span class="text-body font-medium">모두 다시 읽기</span><span class="text-small text-text-muted">수정 시각과 크기가 그대로인 파일도 모두 다시 읽습니다. 내용만 바뀐 파일이나, 파서를 고친 뒤 실패하거나 건너뛴 문서를 다시 처리할 때 켜세요. 파일이 많으면 오래 걸립니다.</span></span></label>
<label class="flex items-start gap-3" style="cursor: pointer;"><input type="checkbox" style="margin: 3px 0 0; accent-color: var(--accent);"><span class="flex flex-col gap-1"><span class="text-body font-medium">빈 목록도 반영</span><span class="text-small text-text-muted">폴더에 문서가 될 파일이 하나도 없어도 그대로 반영합니다. 켜고 돌리면 이 원천의 문서가 모두 검색에서 빠집니다. 폴더를 정말 비웠을 때만 켜세요. 폴더가 없거나 읽지 못하면 켜도 실패합니다.</span></span></label>
</div>
<div class="flex items-center gap-2 flex-wrap" style="justify-content: flex-end; padding-top: var(--spacing-4); border-top: 1px solid var(--border);">
<x-import component-from-global-scope="AgentOsUi.Button" variant="secondary" type="button">취소</x-import>
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="button">동기화 시작</x-import>
</div>
</dialog>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
