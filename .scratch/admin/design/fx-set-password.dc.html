<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비밀번호 정하기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agent-os/styles.css">
<link rel="stylesheet" href="ds/agent-os/fonts/fonts.css">
<link rel="stylesheet" href="ds/agent-os/_ds_bundle.css">
<script src="ds/agent-os/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0} .h-control,select,[role="menuitem"],[role="tab"]{padding-bottom:2px!important} a{color:var(--accent)} a:hover{color:var(--text)}</style></helmet>
<div data-theme="nokcheong" data-mode="light" style="box-sizing: border-box; min-height: 100vh; display: flex; justify-content: center; padding: calc(var(--spacing-8) * 3) var(--spacing-4) var(--spacing-8); background: var(--bg); color: var(--text); font-family: var(--sans);">
<div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: var(--spacing-6);">
<span class="text-body font-semibold">rag-engine</span>
<header class="flex flex-col gap-1">
<h1 style="margin: 0; font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight);">비밀번호 정하기</h1>
<p class="text-body text-text-muted" style="margin: 0;">시스템 관리자가 준 링크로 열었습니다. 정한 비밀번호로 로그인합니다.</p>
</header>

<sc-if value="{{ form }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AgentOsUi.Card" padding="4">
<form class="flex flex-col" style="gap: var(--spacing-6); margin: 0; padding: var(--spacing-2);" onsubmit="return false;">
<div class="flex flex-col gap-2">
<sc-if value="{{ firstOk }}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호" type="password" value="Xxxxxxx1"></x-import></sc-if>
<sc-if value="{{ is.toolong }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호" type="password" value="Xxxxxxx1!xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" error="128자 이하로 줄이세요."></x-import></sc-if>
<dc-import name="cmp-pw-rules" special="{{ special }}" hint-size="100%,112px"></dc-import>
</div>
<sc-if value="{{ secondOk }}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호 다시" type="password"></x-import></sc-if>
<sc-if value="{{ is.mismatch }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="AgentOsUi.TextField" label="새 비밀번호 다시" type="password" value="Xxxxxxx1?" error="위 칸과 같지 않습니다."></x-import></sc-if>
<x-import component-from-global-scope="AgentOsUi.Button" variant="primary" type="submit">비밀번호 정하기</x-import>
</form>
</x-import>
</sc-if>

<sc-if value="{{ is.expired }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="AgentOsUi.Alert" tone="danger" title="이 링크는 더 쓸 수 없습니다"><p class="text-body" style="margin: 0;">링크는 한 번만 쓰이고, 만든 뒤 24시간이 지나면 끝납니다. 다시 만든 링크가 있으면 앞 링크는 쓸 수 없습니다. 시스템 관리자에게 새 링크를 받으세요.</p></x-import>
<a href="fx-login.dc.html" class="text-body" style="width: fit-content;">로그인 화면으로</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["typing", "unmet", "mismatch", "toolong", "expired"], "default": "typing"}, "$preview": {"width": 1280, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'typing';
    const is = { typing: state === 'typing', unmet: state === 'unmet', mismatch: state === 'mismatch', toolong: state === 'toolong', expired: state === 'expired' };
    const special = is.typing ? 'pending' : (is.unmet ? 'failed' : 'met');
    return {
      is, special, form: !is.expired,
      firstOk: !is.toolong && !is.expired,
      secondOk: !is.mismatch && !is.expired
    };
  }
}
</script>
</body>
</html>
