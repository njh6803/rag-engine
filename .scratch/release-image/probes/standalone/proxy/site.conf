# 프록시의 사이트 설정(프로브, 명세가 고른 꼴). http 문맥에 실린다.
# 밖으로 내보내는 경로는 허용 목록뿐이고 나머지는 404 다.

# 뒷단의 이름은 Docker 내장 DNS 에서 다시 푼다. 컨테이너를 다시 만들어 주소가 바뀌어도 닿는다.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream up_server {
    zone up_server 64k;
    server server:8000 resolve;
}

server_tokens off;

# 요청을 처리하다 난 오류의 로그 줄은 nginx 가 요청 줄을 질의 문자열째 싣는다(문서 키가 질의 문자열에 실린다).
# 그래서 요청에서 난 오류는 crit 이상만 남긴다. 프로세스의 일(시작, 설정 오류)은 nginx.conf 의 error_log 가 남긴다.
error_log /dev/stderr crit;

# 접근 로그는 요청 줄을 통째로 남기지 않는다. $uri 는 nginx 가 정규화한 경로이고 질의 문자열이 없다.
log_format rag '$time_iso8601 $remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 8443 ssl;
    server_name _;
    access_log /dev/stdout rag;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # add_header 는 location 에 하나라도 적으면 server 의 것이 물려지지 않는다. location 에는 적지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 올리는 파일의 상한은 서버가 판정한다(RAG_MAX_UPLOAD_MB). 프록시는 크기를 막지 않고 본문을 모으지 않는다.
    client_max_body_size 0;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 받은 값에 덧붙이지 않고 덮어쓴다.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MCP 의 응답은 이어 보내는 응답(text/event-stream)이다. 모으지 않고 온 대로 넘긴다.
    location = /mcp {
        proxy_buffering off;
        proxy_pass http://up_server;
    }

    location /api/v1/ingest/ {
        proxy_pass http://up_server;
    }
    location /api/v1/admin/ {
        proxy_pass http://up_server;
    }
    location = /health {
        proxy_pass http://up_server;
    }

    location / {
        return 404;
    }
}
