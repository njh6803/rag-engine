# 대조용 사이트 설정(프로브). site.conf 에서 MCP 경로의 `proxy_buffering off` 와 올리기의
# `proxy_request_buffering off`·`client_max_body_size 0` 을 뺀 nginx 기본값이다.
# 접근 로그도 nginx 의 기본 형식(combined)이라 요청 줄이 질의 문자열째 남는다.

resolver 127.0.0.11 valid=5s ipv6=off;

upstream up_server {
    zone up_server 64k;
    server server:8000 resolve;
}

server_tokens off;

server {
    listen 8443 ssl;
    server_name _;
    access_log /dev/stdout;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /mcp {
        proxy_pass http://up_server;
    }
    location /api/v1/ingest/ {
        proxy_pass http://up_server;
    }
    location /api/v1/admin/ {
        proxy_pass http://up_server;
    }
    location = /health {
        proxy_pass http://up_server;
    }

    location / {
        return 404;
    }
}
