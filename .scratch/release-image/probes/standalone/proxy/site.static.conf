# 대조용 사이트 설정(프로브). site.conf 에서 `resolver` 와 `upstream ... resolve` 를 빼고 뒷단을
# `proxy_pass http://server:8000` 으로 바로 적었다. nginx 는 이 이름을 시작할 때 한 번만 푼다.
# 서버 컨테이너의 주소가 바뀐 뒤에도 닿는지를 site.conf 와 견준다(run.py 의 recover 단계).

server_tokens off;

error_log /dev/stderr crit;

log_format rag '$time_iso8601 $remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 8443 ssl;
    server_name _;
    access_log /dev/stdout rag;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 0;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /mcp {
        proxy_buffering off;
        proxy_pass http://server:8000;
    }
    location /api/v1/ingest/ {
        proxy_pass http://server:8000;
    }
    location /api/v1/admin/ {
        proxy_pass http://server:8000;
    }
    location = /health {
        proxy_pass http://server:8000;
    }

    location / {
        return 404;
    }
}
