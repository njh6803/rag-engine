# release-image 05(노트 검사가 업그레이드 느낌표를 지키게 한다)의 시험과 배선에 넣는 변이.
# 옮겨 온 판정(agent-os 의 시험)은 구현 전부터 초록이라 판정마다 깨어 빨강을 본다. 이 저장소가 더한
# 마이그레이션 판정과 배선(검사 러너, ci.yml, PR 제목 워크플로)도 같다.
# 실행: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/release-image/probes/check_notes_mutations.toml
# 변이마다 그 갈래를 고정한 시험 하나만 돈다(파일 전체는 임시 git 저장소를 시험마다 만들어 수 분이 걸린다).
# 이 표는 agent-os 의 변이 파일을 옮긴 것이 아니라 이 저장소에서 새로 지었다.

[[mutation]]
name = "마이그레이션 판정이 아무것도 모으지 않는다"
tests = ["tests/tools/test_check_notes.py::test_마이그레이션을_더하고_느낌표가_없으면_막는다"]
expect = "red"
expect_output = ["막아야 한다(종료 0)"]

[[mutation.edit]]
file = "tools/check_notes.py"
old = '''    migrations = sorted({c.path for c in changes if _is_migration(c.path)})'''
new = '''    migrations: list[str] = []'''

[[mutation]]
name = ".py 가 아닌 파일도 마이그레이션으로 센다"
tests = ["tests/tools/test_check_notes.py::test_versions_밖이거나_py가_아닌_파일은_마이그레이션이_아니다"]
expect = "red"
expect_output = ["지나야 한다(종료 1)"]

[[mutation.edit]]
file = "tools/check_notes.py"
old = '''    return path.startswith(f"{MIGRATION_VERSIONS}/") and path.endswith(".py")'''
new = '''    return path.startswith(f"{MIGRATION_VERSIONS}/")'''

[[mutation]]
