#       uv run python tools/mutate.py .scratch/core/probes/admin_queries_mutations.toml

[[mutation]]
name = "기다림이 지운 문서도 작업이 남은 것으로 센다"
tests = ["tests/app/test_await_documents.py"]
expect = "red"
expect_output = ["WaitStatus.TIMED_OUT: 2> != <WaitStatus.FINISHED: 1>"]

[[mutation.edit]]
file = "src/rag_engine/app/await_documents.py"
old = '''    document = await transaction.documents.get(document_id)
    if document is None or document.deleted_at is not None:
