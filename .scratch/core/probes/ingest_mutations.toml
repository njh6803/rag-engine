# core 05(수집 API의 첫 길)가 더한 시험의 변이. 구현과 함께 쓴 시험이라 빨강을 본 적이 없어 변이로 본다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test
#       uv run python tools/mutate.py .scratch/core/probes/ingest_mutations.toml
# 첫 실행에서 4번(키도 파일 이름도 없는 요청)과 7번(건너뛴 수집의 조각 복사 칸)이 초록으로 살아남았다.
# HTTP 시험은 filename="" 을 422로 읽는 다른 길이 있어 4번을 못 잡았고, 7번은 조각 행을 두고 갱신일을
# 바꿔 본 시험이 없었다. 그래서 `tests/app/test_ingest.py`에 시험 둘을 더하고 그 시험을 겨누게 고쳤다.

