# core 06(TEI, Kiwi, 구조 우선 청킹 티켓)가 더한 시험의 변이. 구현과 함께 쓴 시험이라 변이로 본다.
# 실행: PYTHONUTF8=1 uv run python tools/mutate.py .scratch/core/probes/chunker_mutations.toml
# 청킹 변이는 tests/adapters/test_structure_first_chunker.py, 키워드는 test_kiwi.py, 글 짓기는
# tests/domain/test_index_text.py, 오프셋 변환은 test_utf8_offsets.py 만 돈다. TEI 어댑터는
# 요청을 짜는 곳(글자 수 상한, 본문 바이트 상한, 오프셋 잇기, PR #8 봇 회차가 짚은 둘)만
# test_tei_embedder.py 로 재고, 나머지(`/info` 확인, 오류 번역, 응답 검증)와 스텁(test_tei_stub.py)은
# 변이를 재지 않았다.
# 표지(expect_output)는 변이를 손으로 넣어 본 실패 출력에서 고른, 그 변이가 만든 받은 값의 문구다.
# 시험 이름은 시험 원문에 글자 그대로 있어 표지가 되지 못한다(대기열 417).

[[mutation]]
name = "같은 수준의 제목이 앞 제목을 밀어내지 않는다"
tests = ["tests/adapters/test_structure_first_chunker.py"]
expect = "red"
expect_output = ["At index 1 diff: ('가', '나', '다') != ('가', '다')"]

[[mutation.edit]]
file = "src/rag_engine/adapters/chunking.py"
old = '''stack[-1][0] >= block.level'''
new = '''stack[-1][0] > block.level'''

[[mutation]]
name = "긴 제목 블록의 경계를 한 토큰 줄인다"
tests = ["tests/adapters/test_structure_first_chunker.py"]
expect = "red"
expect_output = ["가가가가가가가가가가가가가가가가가가가가\\n\\n본문' != '본문'"]

[[mutation.edit]]
file = "src/rag_engine/adapters/chunking.py"
old = '''block.level is not None and tokens <= limit:'''
new = '''block.level is not None and tokens < limit:'''

[[mutation]]
name = "절 경로의 몫을 상한 전체로 푼다"
tests = ["tests/adapters/test_structure_first_chunker.py"]
expect = "red"
expect_output = ["가가가가가가가가가가 > 나나나나나나나나나나 > 다다다다다다다다다다"]

[[mutation.edit]]
file = "src/rag_engine/domain/index_text.py"
old = '''_SECTION_SHARE: Final = 4'''
new = '''_SECTION_SHARE: Final = 1'''

[[mutation]]
name = "마지막 조각 합치기를 끈다"
tests = ["tests/adapters/test_structure_first_chunker.py"]
expect = "red"
expect_output = ["Left contains one more item: '다'"]

[[mutation.edit]]
file = "src/rag_engine/adapters/chunking.py"
old = '''_TAIL_SHARE: Final = 10'''
new = '''_TAIL_SHARE: Final = 100000'''

[[mutation]]
name = "표 조각도 마지막 조각 합치기에 넣는다"
tests = ["tests/adapters/test_structure_first_chunker.py"]
expect = "red"
expect_output = ["Right contains one more item: '머\\n가'"]

[[mutation.edit]]
file = "src/rag_engine/adapters/chunking.py"
old = '''if any(unit.standalone for unit in (*previous.own, *last.own)):'''
new = '''if False:'''

