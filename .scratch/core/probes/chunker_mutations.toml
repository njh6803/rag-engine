# TEI 어댑터의 요청 짜기(글자 수 상한과 본문 바이트 상한, PR #8 봇 회차가 짚은 둘)다. 아래 셋은 스텁이
# TEI처럼 422·413으로 거부해 시험이 빨개진다.
