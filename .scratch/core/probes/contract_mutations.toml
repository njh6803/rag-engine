# core 02(계약 티켓)가 더한 시험의 변이. 구현 뒤에 쓴 시험이라 빨강을 본 적이 없어 변이로 본다.
# 실행: PYTHONUTF8=1 RAG_TEST_DATABASE_URL=postgresql://rag_test:rag_test@127.0.0.1:55432/rag_test
#       uv run python tools/mutate.py .scratch/core/probes/contract_mutations.toml
# import-linter의 금지 import는 pytest 밖이라 표에 없고 손으로 봤다(일지 2026-11-10 core 02).

[[mutation]]
name = "대기 작업 부분 유일 색인을 실행 중 작업에 건다"
tests = ["tests/adapters/test_migrations.py", "-k", "대기_작업"]
expect = "red"
expect_output = ["DID NOT RAISE"]

[[mutation.edit]]
file = "src/rag_engine/adapters/postgres/migrations/versions/0001_initial_schema.py"
