# 로컬 pre-commit과 같은 검사. 훅은 각자 설치해야 하므로 CI가 최종 판정이다. 파이썬(python), 컨테이너 이미지(image),
# 커밋 검사(ticket), 검색 평가의 빠른 게이트(eval-fast)와 전체 게이트(eval-full)가 잡 다섯으로 함께 돌고, 필수 검사는
# 그 결과를 모으는 verify 하나다(docs/constitution/operations.md).
# 잡을 더하면 verify 의 needs 에 넣는다. 빠뜨리면 verify 가 빨갛다.
# 체크아웃하는 잡은 모두 persist-credentials: false 다. 모두 PR 의 코드를 짓고 돌리는데 체크아웃 뒤에 github.com 을 상대로
# 한 git 명령(push, 인증된 fetch)이 없어서, 체크아웃 토큰을 .git/config 에 남기지 않는다(CWE-522).
# 워크플로 하드닝은 zizmor 가 판정한다(설정은 .github/zizmor.yml). 빠뜨리면 artipacked 가, 서드파티 액션을 해시 대신
# 태그로 가져오면 unpinned-uses 가 python 잡을 빨갛게 한다. 자격 증명이 필요한 잡이 생기면 그 체크아웃 줄에
# `# zizmor: ignore[artipacked]` 와 까닭을 함께 둔다.
# 잡마다 timeout-minutes 를 둔다. 없으면 기본값 360분까지 매달린다. 첫 값은 지난 실행이 없어 어림이다.
name: ci

# 개발 브랜치 dev 가 서면(ADR 0016) 티켓 PR 은 dev 로, 출시 PR(dev→main)과 핫픽스는 main 으로 간다. PR 은 base 를
# 가리지 않고 dev PR 과 main PR 이 같은 잡(python, image, ticket, eval-fast, eval-full)과 그 결과를 모으는 verify 를
# 돈다. 푸시는 main 과 dev 둘이다. 검색 평가의 빠른 게이트(eval-fast)는 검색에 영향을 주는 경로가 바뀐 PR 과 모든 푸시,
# 수동 실행에서 평가하고(경로의 목록과 판정은 tools/eval_gate_paths.py), 나머지 PR 에서는 잡이 평가 스텝을 건너뛴 채
# 성공으로 끝난다. 잡을 건너뛰면 verify 가 빨강으로 세기 때문이다. 전체 게이트(eval-full, search-eval 15)는 base 가
# main 인 PR 과 수동 실행에서만 평가하고(같은 파일의 EVAL_GATE=full 판정), 그 밖(dev 로 가는 PR 과 푸시)에서는 같은 식으로
# 평가 스텝을 건너뛴 채 성공으로 끝난다. dev 로 가는 PR 은 리랭크 기록과 baseline-full.json 을 맞추지 않고 병합될 수 있어,
# 출시 PR 앞에서 맞추는 절차를 next-session 의 merge.md "출시 PR" 이 적는다.
# 수동 실행(workflow_dispatch)은 `gh workflow run ci.yml --ref <브랜치>` 로 dev 와 main 이 아닌 브랜치에서 띄운다. dev 나
# main 에서 띄우면 그 브랜치의 푸시와 같은 concurrency 그룹이라 서로 취소한다. 푸시는 main 과 dev 만 CI 를 띄우므로 다른
# 브랜치에서 앞 실행을 취소하려면 같은 브랜치로 수동 실행을 한 번 더 띄운다.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # ubuntu-latest 가 26.04(ripgrep 15)로 넘어가 rg 14 의 동작을 가정한 tests/tools/test_hook_env_read_rg.py 가
    # agent-os 에서 깨졌다. 그 시험을 그대로 복사했으므로 24.04 에 고정한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      RAG_TEST_DATABASE_URL: postgresql://rag_test:rag_test@127.0.0.1:5432/rag_test
    # 테스트 PostgreSQL. 로컬의 compose.test.yml 과 같은 이미지·역할이다(맞는지는 tests/tools/test_run_checks_database.py
    # 가 글자로 본다). 준비 신호를 기다린 뒤에 단계가 시작한다.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: rag_test
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rag_test -d rag_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: command -v rg > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ripgrep; }
      - run: uv run pytest -q
      - run: uv run python tools/check_instructions.py
      - run: uv run python tools/check_type_escapes.py
      - run: uv run python tools/run_hooks.py
      - run: uv run zizmor --offline --strict-collection --config .github/zizmor.yml .

  # 컨테이너 이미지는 첫날부터 CI 에서 짓는다(operations.md 검증). 판 태그를 붙여 내는 것은 release-image 다. 지은
  # 이미지를 띄워 /health 가 답하는지까지 본다. 진입점이나 root 가 아닌 사용자의 권한이 틀리면 짓기는 초록이어도
  # 여기서 빨갛다.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t rag-engine:ci .
      # serve는 설정을 읽고 시작한다. 이 잡은 /health만 보고 엔진은 첫 질의 때 연결하므로 가짜 연결 주소로 된다.
      - run: >
          docker run -d --name rag-engine -p 8000:8000
          -e RAG_DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci
          -e RAG_DATA_DIR=/data
          -e RAG_ALLOWED_HOSTS=localhost
          rag-engine:ci
      - run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs rag-engine
          exit 1

  # 커밋 검사. pre-commit 은 훅을 건너뛴 커밋(--no-verify)을 보지 못하므로 PR 마다 PR 의 머리 브랜치·머리 커밋·base
  # 커밋으로 같은 판정을 하고, 가리키는 티켓의 Status: 가 done 인지까지 본다. PR 값은 env 로 넘긴다(워크플로 감사가
  # 식의 바로 펼침을 주입으로 잡는다).
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          python3 tools/check_ticket.py --ci

  # 검색 평가의 빠른 게이트(search-eval 11, ADR 0018). 평가 전용 compose(compose.eval.yml)로 PostgreSQL 과 임베딩 TEI 를
  # 띄우고 공공 문서 묶음을 색인해 빠른 실행(run --through fused)의 보고서를 기준 보고서(baseline-fast.json)와 견준다.
  # 추론 기록(records/)을 읽으므로 기록에 있는 글에는 모델을 부르지 않는다. 늘 시작하고, 체크아웃 다음 스텝
  # (tools/eval_gate_paths.py)이 평가할지를 정한다. 평가하지 않으면 나머지 스텝을 스텝의 조건(if)으로 넘긴 채 성공으로
  # 끝난다. 잡 자체를 건너뛰면 verify 가 빨강으로 세기 때문이다. 체크아웃은 merge-base 를 구하도록 전체 역사를 받는다.
  # 모델 파일(bge-m3)은 actions/cache 에 둔다(setup-uv 의 enable-cache 가 uv 의 캐시를 복원하고 저장하는 것은 python 잡과
  # 같다). 키는 config.json 의 임베딩 모델과 TEI 판으로 만들어 판정 칸 같은 모델과 무관한 칸이 바뀌어도 캐시가 바뀌지
  # 않는다. 모델을 다 받은 뒤(TEI 가 healthy 가 된 뒤)에만 저장해 부분 폴더가 같은 키로 굳지 않게 한다.
  # 포크 PR 이 캐시를 오염시킬 수 있는지는 GitHub 문서 "Dependency caching
  # reference"(docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching)의 "Restrictions for accessing a
  # cache"와 "Cache access for low-trust workflow triggers"를 읽었다. pull_request 가 만든 캐시는 병합 ref(refs/pull/…/merge)에
  # 묶여 기본 브랜치의 범위에 쓰지 못하고, 기본 브랜치의 범위에 쓸 수 있는 계기는 push 와 workflow_dispatch 등뿐이다.
  # 이 잡의 계기는 pull_request, push, workflow_dispatch 라 포크 PR 이 dev 의 캐시를 덮어쓰지 못한다.
  eval-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      RAG_EVAL_DATABASE_URL: postgresql://rag_eval:rag_eval@127.0.0.1:55433/rag_eval
      RAG_EVAL_EMBEDDING_URL: http://127.0.0.1:18083
      RAG_EVAL_DATA_DIR: /tmp/rag-eval-data
      RAG_EVAL_TEI_DATA: /tmp/rag-eval-tei
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # PR 값은 env 로 넘기고 식을 스크립트에 바로 펼치지 않는다(사용자가 정하는 head_ref 의 바로 펼침은 zizmor 가 주입으로
      # 잡고, 두 SHA 는 잡지 않지만 같은 모양을 지킨다). 바뀐 경로의 이름이 워크플로 명령으로 읽히지 않게 출력 동안 명령
      # 해석을 멈춘다(ticket 잡과 같다).
      - id: paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          python3 tools/eval_gate_paths.py
          echo "::$marker::"
      - if: steps.paths.outputs.evaluate == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv python install 3.12
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv sync --frozen
      - if: steps.paths.outputs.evaluate == 'true'
        id: model
        run: >
          python3 -c "import json;
          c = json.load(open('evals/public-docs/config.json', encoding='utf-8'));
          print('key=eval-tei-%s-%s' % (c['embedding_model'].replace('/', '-'), c['tei_version']))"
          >> "$GITHUB_OUTPUT"
      - if: steps.paths.outputs.evaluate == 'true'
        id: tei-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/rag-eval-tei
          key: ${{ steps.model.outputs.key }}
      - if: steps.paths.outputs.evaluate == 'true'
        id: tei
        run: |
          mkdir -p "$RAG_EVAL_DATA_DIR" "$RAG_EVAL_TEI_DATA"
          docker compose -f compose.eval.yml up -d --wait
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv run python tools/search_eval.py validate evals/public-docs
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv run python tools/search_eval.py index evals/public-docs --records read
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv run python tools/search_eval.py validate evals/public-docs --indexed
      - if: steps.paths.outputs.evaluate == 'true'
        run: >
          uv run python tools/search_eval.py run evals/public-docs
          --through fused --records read --out eval-out
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv run python tools/search_eval.py compare eval-out evals/public-docs --gate fast
      # 보고서 둘(report.json, report.md)은 게이트가 빨강이어도 올린다. 첫 기준 보고서는 이 산출물로 만든다.
      - if: ${{ !cancelled() && steps.paths.outputs.evaluate == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          # 실패한 잡만 다시 돌린 시도가 같은 실행(run)에 같은 이름으로 올리면 v4 가 거부하므로 시도 번호를 붙인다.
          name: eval-fast-report-${{ github.run_attempt }}
          path: eval-out/
          if-no-files-found: warn
          retention-days: 30
      # TEI 가 모델 폴더에 쓴 파일은 root 소유라 저장 스텝(러너 사용자)이 읽지 못할 수 있다. 컨테이너를 내리고 소유를
      # 돌려 둔 뒤 저장한다. 게이트가 빨강이어도 TEI 가 healthy 가 된(모델을 다 받은) 뒤라면 모델 캐시는 저장한다. 같은 키로
      # 이미 저장되어 있으면 건너뛴다.
      - if: ${{ !cancelled() && steps.tei.outcome == 'success' && steps.tei-cache.outputs.cache-hit != 'true' }}
        run: |
          docker compose -f compose.eval.yml down
          sudo chown -R "$(id -u):$(id -g)" "$RAG_EVAL_TEI_DATA"
      - if: ${{ !cancelled() && steps.tei.outcome == 'success' && steps.tei-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/rag-eval-tei
          key: ${{ steps.model.outputs.key }}

  # 검색 평가의 전체 게이트(search-eval 15, ADR 0018). 빠른 게이트와 같은 차례로 공공 문서 묶음을 색인하고 전체 실행(run
  # --through rerank)의 보고서를 기준 보고서(baseline-full.json)의 리랭크 뒤 줄과 견준다. CI 는 리랭커를 띄우지 않는다
  # (compose.eval.yml 도 띄우지 않는다). RAG_EVAL_RERANKER_URL 을 주지 않으므로 리랭크 점수는 리랭크 기록(rerank.jsonl)
  # 에서만 읽고, 기록에 없는 쌍이 하나라도 있으면 실패한다. 늘 시작하고, 체크아웃 다음 스텝(EVAL_GATE=full)이 평가할지를
  # 정한다. base 가 main 인 PR 과 수동 실행에서만 평가하고, 그 밖(dev 로 가는 PR, 푸시)에서는 나머지 스텝을 스텝의 조건
  # (if)으로 넘긴 채 성공으로 끝난다. 잡 자체를 건너뛰면 verify 가 빨강으로 센다. main 푸시에서는 평가하지 않는다(main 은
  # 최신 기준을 강제해 PR 의 머리가 곧 병합된 내용이다). 바뀐 경로를 보지 않으므로 merge-base 가 필요 없어 얕은 체크아웃이다.
  # 모델 파일은 eval-fast 와 같은 캐시 키로 복원만 한다. 저장은 eval-fast 가 맡는다(두 잡이 같은 키를 동시에 저장하려
  # 하지 않게 한다). 캐시 오염에 대한 읽은 문서와 결론은 eval-fast 의 주석과 같다(이 잡의 계기도 pull_request, push,
  # workflow_dispatch 이고 권한은 contents: read 뿐이며 비밀을 쓰지 않는다).
  eval-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      RAG_EVAL_DATABASE_URL: postgresql://rag_eval:rag_eval@127.0.0.1:55433/rag_eval
      RAG_EVAL_EMBEDDING_URL: http://127.0.0.1:18083
      RAG_EVAL_DATA_DIR: /tmp/rag-eval-data
      RAG_EVAL_TEI_DATA: /tmp/rag-eval-tei
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # PR 값은 env 로 넘기고 식을 스크립트에 바로 펼치지 않는다(eval-fast 와 같다).
      - id: paths
        env:
          EVAL_GATE: full
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          python3 tools/eval_gate_paths.py
          echo "::$marker::"
      - if: steps.paths.outputs.evaluate == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv python install 3.12
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv sync --frozen
      - if: steps.paths.outputs.evaluate == 'true'
        id: model
        run: >
          python3 -c "import json;
          c = json.load(open('evals/public-docs/config.json', encoding='utf-8'));
          print('key=eval-tei-%s-%s' % (c['embedding_model'].replace('/', '-'), c['tei_version']))"
          >> "$GITHUB_OUTPUT"
      - if: steps.paths.outputs.evaluate == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/rag-eval-tei
          key: ${{ steps.model.outputs.key }}
      - if: steps.paths.outputs.evaluate == 'true'
        run: |
          mkdir -p "$RAG_EVAL_DATA_DIR" "$RAG_EVAL_TEI_DATA"
          docker compose -f compose.eval.yml up -d --wait
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv run python tools/search_eval.py validate evals/public-docs
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv run python tools/search_eval.py index evals/public-docs --records read
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv run python tools/search_eval.py validate evals/public-docs --indexed
      # RAG_EVAL_RERANKER_URL 이 없으므로 리랭크 점수를 기록에서만 읽는다. 기록에 없는 쌍이 하나라도 있으면 종료 코드 1이다.
      - if: steps.paths.outputs.evaluate == 'true'
        run: >
          uv run python tools/search_eval.py run evals/public-docs
          --through rerank --records read --out eval-out
      - if: steps.paths.outputs.evaluate == 'true'
        run: uv run python tools/search_eval.py compare eval-out evals/public-docs --gate full
      # 보고서 둘(report.json, report.md)은 게이트가 빨강이어도 올린다. 첫 기준 보고서는 이 산출물로 만든다.
      - if: ${{ !cancelled() && steps.paths.outputs.evaluate == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          # 실패한 잡만 다시 돌린 시도가 같은 실행(run)에 같은 이름으로 올리면 v4 가 거부하므로 시도 번호를 붙인다.
          name: eval-full-report-${{ github.run_attempt }}
          path: eval-out/
          if-no-files-found: warn
          retention-days: 30

  # 필수 검사. 건너뛴 잡은 필수 검사여도 성공으로 보고되고(GitHub 문서), 앞 잡이 실패하면 needs 로 이은 잡은
  # 기본적으로 건너뛴다. 그래서 always() 로 언제나 돌고, needs 의 결과가 모두 success 일 때만 초록이다.
  # failure 뿐 아니라 cancelled 와 skipped 도 빨강이다.
  # needs 에 없는 잡은 필수 검사 밖에서 돈다. 그래서 같은 실행의 모든 시도(filter=all)의 잡 이름을 API 로 읽어, 자기
  # 밖의 잡이 needs 에 없으면 빨강이다. 지금 시도만 읽지 않는 것은, 실패한 잡만 다시 돌린 시도에서는 앞 시도의 잡이
  # 새 시도로 옮겨지는 중이라 목록에서 빠질 수 있기 때문이다. 잡에 name: 을 두지 않으므로 API 의 잡 이름이 잡 id 와
  # 같다. 읽은 목록에 verify 자신이 없으면(빈 목록이면) 비교할 것이 없어 조용히 초록이 되므로 그것도 빨강이다.
  # 일부러 필수 검사 밖에 둘 잡이 생기면 아래 차집합에 그 이름을 예외로 더한다. verify 뒤에 도는 잡(needs: [verify])은
  # 첫 시도에서는 verify 가 도는 동안 목록에 없어 이 검사가 보지 못하고, 순환이라 needs 에 넣을 수도 없다. 그런 잡은
  # 필수 검사 밖이다.
  verify:
    if: always()
    needs: [python, image, ticket, eval-fast, eval-full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          pages=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100")
          names=$(jq -c '[.[].jobs[].name] | unique' <<< "$pages")
          echo "이 실행의 잡: $names"
          if ! jq -e 'index("verify") != null' <<< "$names" > /dev/null; then
            echo "::error::잡 목록에 verify 가 없다. 목록을 읽지 못한 것이다."
            exit 1
          fi
          outside=$(jq -c --argjson needs "$NEEDS" '. - ["verify"] - ($needs | keys)' <<< "$names")
          if [ "$outside" != "[]" ]; then
            echo "::error::verify 의 needs 에 없는 잡: $outside. 필수 검사 밖에서 돈다."
            exit 1
          fi
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
