# PR 을 고쳤을 때(edited. 본문을 고쳐도 돈다)만 도는 작은 검사. 제목은 squash 커밋의 제목이 되어 릴리스 번호를 정하므로(tools/release.py), 제목의
# 꼴과 느낌표가 upgrade/ 원고·마이그레이션 파일과 짝이 맞는지를 노트 검사(tools/check_notes.py --title-only)가 본다. 판정과
# 입력은 그 도구의 독스트링이 원천이다.
# 필수 검사가 아니다. ci.yml 의 verify 가 모으는 잡에 들지 않는다. 필수 검사로 두면 제목을 고치지 않은 PR 에서는 이
# 워크플로가 돌지 않아 결과가 없고, 병합이 영영 대기한다. 제목을 고친 뒤 ci.yml 은 다시 돌지 않으므로(그 on 에 edited 를
# 두지 않았다. 두면 본문만 고쳐도 무거운 잡이 다시 돈다) 이 워크플로가 제목 몫의 빨강을 PR 에 남긴다. 병합 직전에 이
# 검사가 빨갛지 않은지는 사람과 병합 스킬이 gh pr checks 로 본다.
# PR 의 값은 식으로 run 에 펼치지 않고 env 로 넘긴다(zizmor 의 template-injection 판정. ci.yml 의 ticket 잡과 같다). 제목은
# 사람이 고치는 값이다. 도구는 표준 라이브러리만 써서 uv 없이 러너의 python3 으로 돈다. 출력에 PR 이 고른 브랜치·파일
# 이름이 실리므로 도구를 부르기 전에 워크플로 명령을 멈춘다(ci.yml 의 ticket 잡과 같다).
name: pr-title

on:
  pull_request:
    branches: [main, dev]
    types: [edited]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    # 출시 PR(dev→main)과 운영에서 개발로 합치기 PR(main→dev)은 건너뛴다. 그 PR 의 제목은 squash 가 아닌 병합 커밋이라
    # 릴리스 번호를 정하지 않고, 변경 목록에 그동안의 원고와 마이그레이션이 모두 든다. 도구도 같은 머리 브랜치를 건너뛴다.
    # 핫픽스 PR(hotfix/*)은 건너뛰지 않는다.
    if: ${{ github.head_ref != 'main' && github.head_ref != 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          python3 tools/check_notes.py --title-only
