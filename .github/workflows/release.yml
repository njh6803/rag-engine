# 릴리스 워크플로(release-image 08, ADR 0020, .scratch/release-image/spec.md "릴리스 워크플로"). main 에 푸시가 오면(출시 PR 과
# 핫픽스 PR 의 병합) 릴리스 번호와 노트를 계산하고, 이미지 둘(server, worker)을 지어 실제로 띄워 시험하고 점검한 뒤 올리고,
# 번호 태그를 붙여 GitHub 릴리스를 공개한다. 릴리스의 때와 번호는 사람이 정하지 않는다. 지난 릴리스 뒤로 제품 변경이 없으면
# 첫째 잡이 성공으로 끝나고 둘째 잡은 건너뛴다. 워크플로 자체에는 자동 시험이 없다. zizmor 가 감사하고 워크플로가 부르는
# 판정은 tools/release.py 와 tools/release_ci.py 의 시험이 보며, 꼴은 tests/tools/test_release_workflow.py 가 글자로 본다.
# agent-os 의 release.yml(커밋 1aac0cf)을 옮겨 이 저장소의 값(이미지 둘, 이름, 묶음, 시험 단계)으로 고쳤다. node, pnpm,
# Playwright 단계는 옮기지 않았다. 첫 실행은 이 기능의 출시 PR 을 병합한 세션이 끝까지 지켜본다.
#
# 수동 실행 계기는 없다. 실패한 릴리스는 실패한 잡을 다시 돌려 잇는다(`gh run rerun <실행> --failed`).
#
# 잡은 둘이다. 둘로 나눈 까닭은 실패한 잡만 다시 돌리는 길이 둘째 잡의 실패에서 첫째 잡의 이미지를 다시 짓지 않게 하기
# 위해서다(docs/constitution/operations.md "릴리스가 나는 차례와 실패한 릴리스를 다시 돌리는 절차").
#   build   번호·노트 계산, 이미지 둘 짓기, 배포 파일 묶음 짓기, 단독 compose 시험, 점검, 커밋 태그로만 올리기, 아티팩트.
#   publish 아티팩트 대조, 사전 확인, 초안 GitHub 릴리스, 자산, 번호 태그, 공개.
#
# 비밀 값 둘(DOCKERHUB_TOKEN, RELEASE_GH_TOKEN)과 변수 하나(DOCKERHUB_NAMESPACE)는 배포 브랜치를 main 하나로 좁힌 GitHub 환경
# `release` 에 둔다. 두 잡만 그 환경을 쓴다. 단계마다 그 단계가 쓰는 값만 넘긴다. 세분 토큰(RELEASE_GH_TOKEN)은 둘째 잡의
# 릴리스 단계만 받는다. 그 단계는 이 번호의 릴리스·태그·초안을 조회하는 사전 확인과 초안 직후 태그 대조, 앞 실행의 초안
# 지우기, 초안 만들기, 자산 올리기, 공개, 실패할 때 초안과 그 번호의 git 태그 지우기다. 기본 토큰은 contents: read 뿐이다.
# 할 일은 사람 몫이고 목록은 명세 "사람 몫"과 이 티켓의 일지에 있다.
#
# 쓰는 액션은 2026-11-20 에 릴리스 목록에서 고른 최신 판이고 커밋 해시로 고정했다(판은 줄 끝 주석). setup-uv 는 ci.yml 의
# 판(v5.4.2)과 같다. 해시가 주석의 태그를 가리키는지는 `gh api repos/<저장소>/commits/<태그>` 로 대 보았다.
#
# 제한 시간: build 는 캐시가 없는 첫 실행의 셈보다 길게 두었고 publish 는 어림이다. 첫 실제 실행의 소요 시간이 나오면 고친다.
name: release

on:
  push:
    branches: [main]

# 한 번에 하나만 돌고, 기다리는 실행은 가장 나중 것만 남는다(취소하지 않는다). 남은 실행이 지난 릴리스의 버전 태그 뒤의
# 제품 변경을 다시 보므로 밀려난 실행의 변경도 그 릴리스에 실린다. 밀어낸 실행이 밀려난 실행의 커밋보다 나중 커밋일 때만
# 참이다. 실패한 옛 실행을 다시 돌리면 옛 커밋으로 돌며 기다리던 더 새 커밋의 실행을 밀어낼 수 있다는 것을 코드로 읽었고
# 재 보지는 않았다(어림). 그때 옛 커밋의 실행은 조상 검사에서 빨갛게 끝나 잘못된 번호는 나가지 않고, 새 커밋의 변경은
# 다음에 main 이 움직일 때 실린다.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 점검 도구는 digest 로 고정한 공식 컨테이너 이미지다. 판은 Grype 0.121.3, Syft 1.57.1(ADR 0020이 따르는 agent-os
  # 2026-11-13 의 고른 판. 이 저장소에서 다시 고르지 않았다).
  GRYPE_IMAGE: ghcr.io/anchore/grype@sha256:13113eeceab017260370cf540e1d25442c59665fd07d1b09b66d63bb0c282887
  SYFT_IMAGE: ghcr.io/anchore/syft@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060

jobs:
  # 번호와 노트를 계산하고, 이미지 둘을 지어 시험하고 점검하고, 커밋 태그로만 올린다. 출력은 릴리스 번호와 이미지 둘의
  # digest 다. 둘째 잡이 GitHub 릴리스에 올릴 파일은 같은 이름의 아티팩트로 올린다.
  build:
    runs-on: ubuntu-24.04
    # 제한 시간의 셈(캐시가 없는 첫 실행의 최악): 시험용 이미지 둘을 처음부터 짓는 데 10분, 모델 폴더를 맞추는 데 5분,
    # 단독 compose 시험은 임베딩 서버가 모델을 내려받고 올리는 기다림이 compose 의 --wait-timeout 1800초(30분)에 검색
    # 시험과 서버를 죽이고 다시 만드는 시험 10분을 더한 40분, 점검(Grype 의 취약점 DB 를 실행마다 새로 받는다) 10분, 올리기
    # (같은 빌더의 캐시로 다시 짓고 증명과 함께 올린다) 10분, 대조와 아티팩트 5분이다. 합이 80분이라 90분으로 둔다.
    # agent-os 의 짓는 잡 30분을 옮기지 않았다. 1800초의 기다림보다 잡이 먼저 끝난다.
    timeout-minutes: 90
    environment: release
    env:
      PYTHONUTF8: "1"
      # 시험은 올릴 이름이 아니라 이 이름으로 러너에 실은 이미지를 띄운다.
      LOCAL_NAMESPACE: rag-engine-release-test
      # 올리는 커밋 태그. 이미지 올리기가 이 태그로 올리고 대조 단계가 같은 태그를 레지스트리에서 읽는다.
      HASH_TAG: sha-${{ github.sha }}
      # 임베딩 모델 폴더와 시험 로그 폴더(tests/standalone 의 입력). ci.yml 의 standalone 잡과 같다.
      RAG_STANDALONE_MODELS: /tmp/rag-eval-tei
      RAG_STANDALONE_LOGS: /tmp/rag-standalone-logs
    outputs:
      release: ${{ steps.plan.outputs.release }}
      number: ${{ steps.plan.outputs.number }}
      server: ${{ steps.digests.outputs.server }}
      worker: ${{ steps.digests.outputs.worker }}
    steps:
      # 번호 도구가 로컬 태그를 보므로 전체 이력과 태그를 받는다.
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 번호와 노트 계산
        id: plan
        run: |
          python3 tools/release.py number > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"
      # 지난 릴리스의 GitHub 릴리스가 공개 상태인지 GitHub 에 묻는다. 취소나 제한 시간 때문에 정리 단계가 돌지 못해 태그만
      # 남았거나 초안만 남은 릴리스 위에서 새 릴리스를 내지 않기 위해서다. 제품 변경이 없어 성공으로 끝나는 갈래보다 먼저
      # 본다. 버전 태그가 하나도 없는 첫 릴리스에서는 지난 릴리스가 없어 건너뛴다. 공개 GitHub 릴리스의 조회는 초안을 찾지
      # 못한다(404).
      - name: 지난 판의 공개 릴리스 확인
        if: steps.plan.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
        run: |
          if ! draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIOUS_TAG" --jq .draft 2> "$RUNNER_TEMP/err.txt"); then
            cat "$RUNNER_TEMP/err.txt" >&2
            if grep -q 'HTTP 404' "$RUNNER_TEMP/err.txt"; then
              echo "::error::지난 릴리스 $PREVIOUS_TAG 의 공개 GitHub 릴리스를 찾지 못했다. 앞 실행이 정리 없이 끝나 태그나 초안이 남은 것이다. 사용자에게 청해 그 초안과 태그를 지운 뒤 이 실행 전체를 다시 돌린다(docs/constitution/operations.md)."
            else
              echo "::error::지난 릴리스 $PREVIOUS_TAG 의 GitHub 릴리스 조회가 404 가 아닌 오류로 끝났다. 일시 장애일 수 있으니 실패한 잡만 다시 돌린다(gh run rerun <실행 번호> --failed)."
            fi
            exit 1
          fi
          if [ "$draft" != false ]; then
            echo "::error::지난 릴리스 $PREVIOUS_TAG 의 GitHub 릴리스가 초안이다."
            exit 1
          fi
          echo "지난 릴리스 $PREVIOUS_TAG 의 공개 GitHub 릴리스가 있다."
      - name: 판 없음 알림
        if: steps.plan.outputs.release != 'true'
        run: echo "제품 변경이 없어 릴리스를 내지 않는다."

      - name: 빌더 준비
        if: steps.plan.outputs.release == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 증명 없이 러너의 Docker 에 싣는다(증명을 켠 채로는 싣지 못한다). 시험과 점검은 이 이미지로 돈다.
      - name: 이미지 짓기(시험용)
        if: steps.plan.outputs.release == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          NAMESPACE: ${{ env.LOCAL_NAMESPACE }}
          TAG: ${{ steps.plan.outputs.number }}
          VERSION: ${{ steps.plan.outputs.number }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        with:
          source: .
          files: deploy/images/docker-bake.hcl
          load: true
          provenance: false
          sbom: false

      # 단독 compose 시험(ci.yml 의 standalone 잡과 같은 시험)을 러너에 실은 이미지와 올릴 묶음으로 돈다. 올릴 것 자체를
      # 시험한다. 시험이 쓰는 파이썬 환경과 임베딩 모델 폴더를 먼저 맞춘다.
      # uv 의 캐시는 쓰지 않는다(ci.yml 은 켠다). 비밀 값을 받는 환경 `release` 안에서 돌고 올리는 이미지를 시험하는 잡이라,
      # 다른 실행이 만든 uv 캐시를 읽거나 이 실행이 uv 캐시를 남기는 길을 두지 않는다. 의존성은 매번 새로 받는다. 아래의
      # 임베딩 모델 캐시는 다르다. 읽기만 하고(복원) 남기지 않으며, 시험에 쓰는 데이터라 올리는 이미지에 들어가지 않는다.
      - name: uv 준비
        if: steps.plan.outputs.release == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false
      - name: 파이썬 준비
        if: steps.plan.outputs.release == 'true'
        run: uv python install 3.12
      - name: 파이썬 의존성
        if: steps.plan.outputs.release == 'true'
        run: uv sync --frozen
      # 모델 폴더는 eval-fast 잡과 같은 캐시 키로 복원만 한다(저장은 eval-fast 가 맡는다). 키는 평가 설정의 임베딩 모델과 TEI
      # 판으로 만든다. 캐시가 없으면 빈 폴더로 시험하고 임베딩 서버의 첫 시작이 내려받는다.
      - name: 임베딩 모델 캐시 키
        id: model
        if: steps.plan.outputs.release == 'true'
        run: >
          python3 -c "import json;
          c = json.load(open('evals/public-docs/config.json', encoding='utf-8'));
          print('key=eval-tei-%s-%s' % (c['embedding_model'].replace('/', '-'), c['tei_version']))"
          >> "$GITHUB_OUTPUT"
      - name: 임베딩 모델 캐시
        if: steps.plan.outputs.release == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rag-eval-tei
          key: ${{ steps.model.outputs.key }}
      # 복원한 뒤에는 캐시가 있든 없든 폴더를 만들어 임베딩 서버의 사용자(uid 10001)에게 준다(설치 안내의 mkdir 와
      # sudo chown 과 같다). 시험은 이 폴더를 묶음 폴더로 복사한 뒤 소유자를 다시 맞추므로 ci.yml 의 standalone 잡은
      # mkdir 만 한다. 여기서는 설치 안내와 같은 모양으로 맞춰 둔다.
      - name: 임베딩 모델 폴더
        if: steps.plan.outputs.release == 'true'
        run: |
          sudo mkdir -p "$RAG_STANDALONE_MODELS"
          sudo chown -R 10001:10001 "$RAG_STANDALONE_MODELS"
          mkdir -p "$RAG_STANDALONE_LOGS"
      # 올릴 배포 파일 묶음을 시험 앞에서 짓는다. 시험이 이 묶음을 풀어 쓰므로 시험한 묶음과 올릴 묶음이 같다(같은 입력이면
      # 바이트가 같다).
      - name: 배포 파일 묶음 짓기
        if: steps.plan.outputs.release == 'true'
        env:
          NUMBER: ${{ steps.plan.outputs.number }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          mkdir -p out
          python3 tools/release.py bundle --number "$NUMBER" --namespace "$NAMESPACE" --out out
      - name: 단독 compose 시험
        if: steps.plan.outputs.release == 'true'
        env:
          RAG_STANDALONE_NAMESPACE: ${{ env.LOCAL_NAMESPACE }}
          RAG_STANDALONE_VERSION: ${{ steps.plan.outputs.number }}
          RAG_STANDALONE_BUNDLE: ${{ github.workspace }}/out/rag-engine-${{ steps.plan.outputs.number }}.tar.gz
        run: uv run pytest tests/standalone -q -p no:cacheprovider
      # 시험이 실패해도 컨테이너 로그를 올린다. 로그에는 질문과 비밀이 없다(시험이 그것을 단언한다).
      - name: 시험 로그 올리기
        if: ${{ !cancelled() && steps.plan.outputs.release == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-logs-${{ github.run_attempt }}
          path: /tmp/rag-standalone-logs/
          if-no-files-found: warn
          retention-days: 14

      # 점검. 러너에 실은 이미지를 `docker save` 로 받은 파일에 Grype 와 Syft 의 공식 컨테이너를 돌린다(액션을 거치지 않는다).
      # Grype 는 거르지 않은 JSON 을 한 번 받고, 고칠 수 있는 Critical 문턱(--only-fixed --fail-on critical)을 따로 한 번 돈다.
      # 문턱의 종료 코드가 0 이면 지나고, 2 면 노트 맨 위에 경고를 싣고 릴리스는 낸다. 그 밖이면 점검이 실패한 것이라 릴리스가
      # 실패한다(점검 결과가 없는 릴리스를 내지 않는다). DB 는 실행마다 새로 받는다. 묵은 DB 로 점검하면 새 취약점을 놓치고,
      # 풀어 둔 크기가 3.2GiB 라 캐시에 두면 저장소의 캐시 한도(10GB)를 잡아먹는다. 이미지 둘은 같은 볼륨을 쓴다. 바깥 이미지
      # (nginx, PostgreSQL, TEI)는 점검하지 않는다.
      - name: 점검
        id: scan
        if: steps.plan.outputs.release == 'true'
        env:
          NUMBER: ${{ steps.plan.outputs.number }}
        run: |
          mkdir -p scan out
          docker volume create grype-db > /dev/null
          grype() {
            docker run --rm -v grype-db:/cache -e GRYPE_DB_CACHE_DIR=/cache \
              -e GRYPE_CHECK_FOR_APP_UPDATE=false -v "$PWD/scan:/in:ro" "$GRYPE_IMAGE" "$@"
          }
          warn=false
          for image in server worker; do
            repo=$(python3 tools/release_ci.py repository "$image")
            docker save "$LOCAL_NAMESPACE/$repo:$NUMBER" -o "scan/$image.tar"
            tested=$(python3 tools/release_ci.py image-id "scan/$image.tar")
            echo "$image=$tested" >> "$RUNNER_TEMP/tested.txt"
            grype "docker-archive:/in/$image.tar" -o json > "out/grype-$image.json"
            code=0
            grype "docker-archive:/in/$image.tar" --only-fixed --fail-on critical -o table || code=$?
            case "$code" in
              0) ;;
              2) warn=true; echo "::warning::$image 에 고칠 수 있는 Critical 이 있다. 노트 맨 위에 경고를 싣는다." ;;
              *) echo "::error::$image 의 Grype 문턱 점검이 종료 코드 $code 로 끝났다. 점검이 실패한 것이다."; exit 1 ;;
            esac
            docker run --rm -e SYFT_CHECK_FOR_APP_UPDATE=false -v "$PWD/scan:/in:ro" "$SYFT_IMAGE" \
              "docker-archive:/in/$image.tar" -o spdx-json > "out/sbom-$image.spdx.json"
          done
          echo "warn=$warn" >> "$GITHUB_OUTPUT"
      # 노트는 모델을 부르지 않고 릴리스 노트 원고와 커밋 제목으로 짠다. "계약의 판" 절은 지은 서버 이미지에서 설정 없이
      # `rag-engine --version` 을 돌려 첫 줄(릴리스 번호)을 뺀 둘째 줄부터를 그대로 싣는다. 문턱을 넘은 이미지가 있으면 노트
      # 맨 위에 경고가 서야 한다. 서지 않았으면 노트 도구와 점검의 판정이 어긋난 것이라 실패한다.
      - name: 노트 짓기
        if: steps.plan.outputs.release == 'true'
        env:
          NUMBER: ${{ steps.plan.outputs.number }}
          WARN: ${{ steps.scan.outputs.warn }}
        run: |
          repo=$(python3 tools/release_ci.py repository server)
          docker run --rm "$LOCAL_NAMESPACE/$repo:$NUMBER" rag-engine --version > "$RUNNER_TEMP/version.txt"
          tail -n +2 "$RUNNER_TEMP/version.txt" > "$RUNNER_TEMP/contract.txt"
          python3 tools/release.py notes --number "$NUMBER" --contract-versions "$RUNNER_TEMP/contract.txt" \
            --grype server=out/grype-server.json --grype worker=out/grype-worker.json > out/notes.md
          if [ "$WARN" = true ] && ! grep -q '^## 경고' out/notes.md; then
            echo "::error::점검은 고칠 수 있는 Critical 을 찾았는데 노트에 경고가 없다."
            exit 1
          fi

      # 시험과 점검을 마친 뒤에 로그인한다. 로그인은 러너에 자격 파일을 남기는데 시험은 의존성의 코드를 러너에서 돌리기 때문이다.
      - name: Docker Hub 로그인
        if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 같은 빌더가 캐시로 다시 지어 증명(출처 증명 mode=max, 소프트웨어 목록)과 함께 커밋 태그로만 올린다. 번호 태그는 둘째
      # 잡이 붙인다.
      - name: 이미지 올리기
        if: steps.plan.outputs.release == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          TAG: ${{ env.HASH_TAG }}
          VERSION: ${{ steps.plan.outputs.number }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        with:
          source: .
          files: deploy/images/docker-bake.hcl
          push: true
          provenance: mode=max
          sbom: true
      # 시험한 이미지와 올린 이미지가 같은지 이미지 저장 방식에 기대지 않고 견준다. 견주는 값은 이미지 설정 파일의 해시다.
      # 설정은 레이어 목록(rootfs.diff_ids)을 담아 설정과 레이어를 함께 가리킨다(ENV 만 다른 이미지도 갈린다). 시험한 쪽은
      # 위에서 받은 저장 파일의 설정 파일을, 올린 쪽은 올린 색인의 linux/amd64 매니페스트의 config.digest 를 읽는다.
      # 다르면 번호 태그와 GitHub 릴리스 앞에서 실패한다.
      # 올린 색인의 digest 는 bake 액션의 metadata 출력이 아니라 방금 올린 커밋 태그에서 레지스트리에 물어 읽는다.
      # 그 출력은 출처 증명에 든 GitHub 컨텍스트까지 실어 agent-os 의 첫 실행 로그에서 약 185KB 였다. 환경 변수로 받으면
      # 리눅스의 한 변수 상한(커널의 MAX_ARG_STRLEN, 128KiB 로 본다)을 넘어 bash 를 띄우지 못했다.
      - name: 시험한 이미지와 올린 이미지 대조
        id: digests
        if: steps.plan.outputs.release == 'true'
        env:
          NUMBER: ${{ steps.plan.outputs.number }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          images='{}'
          for image in server worker; do
            repo=$(python3 tools/release_ci.py repository "$image")
            digest=$(docker buildx imagetools inspect "$NAMESPACE/$repo:$HASH_TAG" --format '{{.Manifest.Digest}}') || {
              echo "::error::$image 의 커밋 태그 $HASH_TAG 를 레지스트리에서 조회하지 못했다."; exit 1; }
            case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *)
              echo "::error::$image 의 올린 digest 를 읽지 못했다: $digest"; exit 1 ;; esac
            docker buildx imagetools inspect "$NAMESPACE/$repo@$digest" --raw > "$RUNNER_TEMP/index.json"
            platform=$(python3 tools/release_ci.py platform-manifest "$RUNNER_TEMP/index.json")
            docker buildx imagetools inspect "$NAMESPACE/$repo@$platform" --raw > "$RUNNER_TEMP/manifest.json"
            pushed=$(python3 tools/release_ci.py manifest-config "$RUNNER_TEMP/manifest.json")
            tested=$(grep "^$image=" "$RUNNER_TEMP/tested.txt" | cut -d= -f2)
            if [ "$tested" != "$pushed" ]; then
              echo "::error::$image: 시험한 이미지 설정 $tested 와 올린 이미지 설정 $pushed 가 다르다."
              exit 1
            fi
            echo "$image: 시험한 것과 올린 것이 같다($pushed). 색인 $digest"
            echo "$image=$digest" >> "$GITHUB_OUTPUT"
            images=$(jq -c --arg i "$image" --arg d "$digest" '. + {($i): $d}' <<< "$images")
          done
          jq -n --arg number "$NUMBER" --arg revision "$GITHUB_SHA" --argjson images "$images" \
            '{number: $number, revision: $revision, images: $images}' > out/release.json
          cat out/release.json
      # 보존 기간은 다시 돌리기의 기한(처음 실행 뒤 30일)보다 짧지 않다. 첫째 잡이 다시 돌면 같은 이름을 덮어쓴다.
      - name: 아티팩트 올리기
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  # 번호 태그를 붙이고 GitHub 릴리스를 공개한다. 번호 태그를 붙이는 단계 앞에서 실패하면 초안을 지우고, 그 단계부터 뒤에서
  # 실패하면 초안을 남긴다. 다만 사전 확인이 앞 실행이 남긴 이 커밋의 초안을 지우고 새로 만든 실행은 번호 태그 앞에서
  # 실패해도 새 초안을 남긴다(앞 실행이 번호 태그를 일부 붙였을 수 있어, 지우면 그 릴리스를 끝낼 초안이 없어진다). 초안
  # 직후의 태그 대조로 실패한 실행은 그 예외에도 초안을 지운다.
  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      PYTHONUTF8: "1"
      NUMBER: ${{ needs.build.outputs.number }}
      DIGEST_SERVER: ${{ needs.build.outputs.server }}
      DIGEST_WORKER: ${{ needs.build.outputs.worker }}
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 아티팩트를 받지 못하면 사전 확인과 초안 만들기 전에 실패한다.
      - name: 아티팩트 받기
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files
      - name: 아티팩트 대조
        run: |
          python3 tools/release_ci.py verify-files --dir files --number "$NUMBER" --sha "$GITHUB_SHA" \
            --digest "server=$DIGEST_SERVER" --digest "worker=$DIGEST_WORKER"
      - name: Docker Hub 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 사전 확인. 그 번호로 이미 있는 것(공개 GitHub 릴리스, git 태그, 초안)을 모아 tools/release_ci.py 가 가른다. 공개
      # GitHub 릴리스가 이 커밋을 가리키면 더 할 일 없이 성공으로 끝나고(action=done), 아래 단계가 모두 건너뛴다.
      - name: 사전 확인
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          tag="v$NUMBER"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > /dev/null 2> "$RUNNER_TEMP/err.txt"; then
            published=true
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/err.txt"; then
            published=false
          else
            cat "$RUNNER_TEMP/err.txt" >&2
            echo "::error::공개 GitHub 릴리스 조회가 404 가 아닌 오류로 끝났다."
            exit 1
          fi
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.type + \" \" + .object.sha")
          tag_commit=""
          if [ -n "$ref" ]; then
            tag_commit=${ref#* }
            if [ "${ref%% *}" = tag ]; then
              tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_commit" --jq .object.sha)
            fi
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | \"\(.id)=\(.target_commitish)\"" > "$RUNNER_TEMP/drafts.txt"
          drafts=()
          while IFS= read -r line; do
            [ -n "$line" ] && drafts+=(--draft "$line")
          done < "$RUNNER_TEMP/drafts.txt"
          python3 tools/release_ci.py precheck --published "$published" --tag-commit "$tag_commit" \
            --sha "$GITHUB_SHA" "${drafts[@]}" > "$RUNNER_TEMP/precheck.txt"
          cat "$RUNNER_TEMP/precheck.txt"
          cat "$RUNNER_TEMP/precheck.txt" >> "$GITHUB_OUTPUT"
      - name: 이미 공개된 판
        if: steps.precheck.outputs.action == 'done'
        run: echo "이 번호의 공개 GitHub 릴리스가 이미 이 커밋을 가리킨다. 더 할 일이 없다."
      # 앞 실행이 남긴 이 커밋의 초안은 지우고 새로 만든다.
      - name: 앞 실행의 초안 지우기
        if: steps.precheck.outputs.action == 'proceed' && steps.precheck.outputs.delete != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          DELETE: ${{ steps.precheck.outputs.delete }}
        run: |
          for id in $DELETE; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "앞 실행의 초안 $id 를 지웠다."
          done
      # 초안은 그 커밋의 전체 해시로 만든다.
      - name: 초안 만들기
        id: draft
        if: steps.precheck.outputs.action == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="v$NUMBER" \
            -f target_commitish="$GITHUB_SHA" -f name="v$NUMBER" -F body=@files/notes.md \
            -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "초안 $id 를 만들었다."
      # 초안이 git 태그를 만든다면 번호 태그를 붙이기 전에 멈춘다. 이 대조로 실패한 실행은 정리 단계가 초안과 그 태그를 지운다.
      - name: 초안 직후 태그 대조
        id: tagcheck
        if: steps.precheck.outputs.action == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$NUMBER" \
            --jq ".[] | select(.ref == \"refs/tags/v$NUMBER\") | .ref")
          if [ -n "$found" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::error::초안을 만든 직후 v$NUMBER 의 git 태그가 원격에 있다. 초안이 태그를 만든다는 뜻이라 릴리스의 차례를 다시 정해야 한다(agent-os ADR 0056 결정 \"판 내기의 차례와 실패\")."
            exit 1
          fi
          echo "초안 단계에서 git 태그가 생기지 않았다."
      - name: 자산 올리기
        if: steps.precheck.outputs.action == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          for file in files/rag-engine-*.tar.gz files/grype-*.json files/sbom-*.spdx.json; do
            gh api --method POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID/assets?name=$(basename "$file")" \
              -H "Content-Type: application/octet-stream" --input "$file" --jq .name
          done
      # 번호 태그를 지키는 차례. 조회해 없으면 커밋 태그를 그대로 복사해 붙이고, 같은 digest 면 그대로 두고, 다른 digest 면
      # 거부하고, 조회가 실패하면 붙이지 않는다. 번호 태그를 공개보다 먼저 붙인다.
      - name: 번호 태그 붙이기
        id: attach
        if: steps.precheck.outputs.action == 'proceed'
        run: |
          for image in server worker; do
            var="DIGEST_$(echo "$image" | tr '[:lower:]' '[:upper:]')"
            digest=${!var}
            ref="$NAMESPACE/$(python3 tools/release_ci.py repository "$image")"
            code=0
            output=$(docker buildx imagetools inspect "$ref:$NUMBER" 2>&1) || code=$?
            verdict=$(python3 tools/release_ci.py judge --exit-code "$code" --digest "$digest" <<< "$output")
            case "$verdict" in
              attach)
                docker buildx imagetools create -t "$ref:$NUMBER" "$ref@$digest"
                code=0
                output=$(docker buildx imagetools inspect "$ref:$NUMBER" 2>&1) || code=$?
                after=$(python3 tools/release_ci.py judge --exit-code "$code" --digest "$digest" <<< "$output")
                if [ "$after" != keep ]; then
                  echo "::error::$image 에 번호 태그를 붙였는데 조회가 같은 digest 를 보이지 않는다($after)."
                  exit 1
                fi
                echo "$image: $NUMBER 를 붙였다($digest)." ;;
              keep) echo "$image: $NUMBER 가 이미 같은 digest($digest)를 가리킨다." ;;
              *)
                echo "::error::$image 의 번호 태그 $NUMBER 를 붙일 수 없다($verdict). 다른 digest 를 가리키거나 조회가 실패했다."
                echo "$output"
                exit 1 ;;
            esac
          done
      - name: 공개
        if: steps.precheck.outputs.action == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" -F draft=false --jq .html_url
      # 정리. 번호 태그를 붙이는 단계 앞에서 실패했을 때만 초안과 그 번호의 git 태그를 지운다(번호 태그 단계가 돌지 못해
      # 건너뛴 상태가 "앞"이다). 다만 사전 확인이 앞 초안을 지우고 새로 만든 실행은 새 초안을 남긴다. 단 초안 직후의 태그
      # 대조로 실패한 실행은 그 예외에도 지운다. 기본 토큰은 태그를 지우지 못해 세분 토큰으로 지운다. 취소와 제한 시간은
      # 이 단계가 돌지 못하므로 남은 초안은 다음 실행의 사전 확인이 맡는다.
      - name: 정리
        if: >-
          failure() && steps.draft.outputs.id != '' && steps.attach.outcome == 'skipped' &&
          (steps.precheck.outputs.replaced != 'true' || steps.tagcheck.outputs.found == 'true')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          # 이미 없는 초안(404)만 지난 것으로 보고, 그 밖의 실패는 경고로 드러낸다. 초안이 남으면 다음 실행의 사전 확인이 막는다.
          draft_deleted=true
          if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" 2> "$RUNNER_TEMP/err.txt"; then
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/err.txt"; then
              cat "$RUNNER_TEMP/err.txt" >&2
              echo "::warning::초안 $DRAFT_ID 를 지우지 못했다. 남은 초안은 다음 실행의 사전 확인이 막는다."
              draft_deleted=false
            fi
          fi
          # 태그 조회가 실패한 것과 태그가 없는 것을 가른다. 조회가 실패하면 태그가 남았을 수 있고, 남은 태그는 다음 실행의 사전 확인이 막는다.
          tag_state=gone
          if ! found_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$NUMBER" --jq ".[] | select(.ref == \"refs/tags/v$NUMBER\") | .ref"); then
            echo "::warning::v$NUMBER 의 git 태그를 조회하지 못했다. 태그가 남았을 수 있고 남은 태그는 다음 실행의 사전 확인이 막는다."
            tag_state=unknown
          elif [ -n "$found_tag" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$NUMBER"
            tag_state=deleted
          fi
          if [ "$draft_deleted" = true ]; then
            echo "초안 $DRAFT_ID 를 지웠다. v$NUMBER 의 git 태그: $tag_state(deleted 는 지웠다, gone 은 없었다, unknown 은 조회 실패)."
          else
            echo "초안 $DRAFT_ID 는 남았다. v$NUMBER 의 git 태그: $tag_state(deleted 는 지웠다, gone 은 없었다, unknown 은 조회 실패)."
          fi
