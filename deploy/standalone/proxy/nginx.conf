# 프록시의 주 설정. 컨테이너는 compose 가 `nginx -c /etc/rag-engine/proxy/nginx.conf` 로 띄운다. 설정을 고친 뒤에는
# 같은 경로를 -c 로 주어 `nginx -t -c ...` 로 확인하고 `nginx -s reload -c ...` 로 다시 읽게 한다.
# 공식 nginx 이미지는 root 가 아닌 사용자(uid 101)로 돌 때 pid 파일과 임시 폴더를 쓸 수 없는 자리에 두므로 모두
# /tmp(compose 가 tmpfs 로 준다) 아래로 옮겼다. 경로 목록과 TLS, 로그는 같은 폴더의 site.conf 가 정한다.

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/rag-engine/proxy/site.conf;
}
