# --- hook_bash_cd_outside (PreToolUse Bash) ---
# 체크아웃 둘은 러너의 임시 저장소이고, ${RUFF_PROJECT} 는 어느 체크아웃에도 들지 않는 임시 디렉터리다.
[[case]]
hook = "hook_bash_cd_outside.py"
expect = "deny"
note = "다른 체크아웃으로 — 일지 2026-10-06-11 의 모양(형제 일지 번호를 보려고 주 체크아웃으로)"
payload = { tool_name = "Bash", tool_input = { command = "cd ${MAIN_REPO}; ls docs/journal" }, cwd = "${WORK_REPO}" }

[[case]]
hook = "hook_bash_cd_outside.py"
expect = "deny"
note = "체크아웃 밖으로 — 일지 2026-10-12-09 의 모양(출력을 읽으려고 스크래치패드로)"
