expect = "silent"
note = "다른 호스트로 가는 301 안내 — 줄인 본문이 없다. 다시 부른 호출의 결과가 요약이면 그때 알린다"
payload = { tool_name = "WebFetch", tool_input = { url = "https://docs.claude.com/en/docs/claude-code/hooks", prompt = "이 페이지의 첫 제목을 그대로 옮긴다" }, tool_response = { bytes = 562, code = 301, codeText = "Moved Permanently", result = "REDIRECT DETECTED: The URL redirects to a location that was not fetched automatically.\n\n    Original URL: https://docs.claude.com/en/docs/claude-code/hooks\n    Redirect URL (from the server's Location header — server-supplied, not verified): https://code.claude.com/docs/en/hooks\n    Status: 301 Moved Permanently\n\n    To complete your request, I need to fetch content from the redirected URL. Please use WebFetch again with these parameters:\n    - url: \"https://code.claude.com/docs/en/hooks\"\n    - prompt: \"이 페이지의 첫 제목을 그대로 옮긴다\"", durationMs = 259, url = "https://docs.claude.com/en/docs/claude-code/hooks" } }

[[case]]
hook = "hook_webfetch_summary.py"
expect = "silent"
note = "본문을 받지 못한 404 — bytes 가 0이라 code 를 보지 않으면 요약으로 읽힌다"
payload = { tool_name = "WebFetch", tool_input = { url = "https://docs.coderabbit.ai/getting-started/subscriptions" }, tool_response = { bytes = 0, code = 404, codeText = "Not Found", result = "The server returned HTTP 404 Not Found.\n\nThe response body was not retrieved. If this URL requires authentication, use an authenticated tool (e.g. `gh` for GitHub, or an MCP-provided fetch tool) instead of WebFetch.", durationMs = 685, url = "https://docs.coderabbit.ai/getting-started/subscriptions" } }

[[case]]
