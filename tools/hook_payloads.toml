payload = { tool_name = "Bash", tool_input = { command = "cd ${WORK_REPO} && git status --short" }, cwd = "${WORK_REPO}/web/packages/ui/src/components" }

# --- hook_bash_commit_msg (PreToolUse Bash) ---
