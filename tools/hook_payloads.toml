# 훅은 이 저장소(${ROOT})의 커밋만 판정한다(대기열 246). 커밋은 ${ROOT} 에서 하고 메시지 파일만 그 저장소의 것을 쓴다.
[[case]]
hook = "hook_bash_commit_msg.py"
expect = "deny"
note = "제목이 72자를 넘는 메시지 파일 — 대기열 222 의 셋째 사건의 모양"
payload = { tool_name = "Bash", tool_input = { command = "git commit -F ${COMMIT_MSGS}/long-subject.txt" }, cwd = "${ROOT}" }

[[case]]
hook = "hook_bash_commit_msg.py"
expect = "silent"
note = "제목이 맞는 메시지 파일 — 그 사건 뒤 고쳐 친 커밋의 모양"
payload = { tool_name = "Bash", tool_input = { command = "git commit -F ${COMMIT_MSGS}/good-subject.txt" }, cwd = "${ROOT}" }

[[case]]
hook = "hook_bash_commit_msg.py"
expect = "silent"
note = "이 저장소 밖에서 같은 파일로 커밋한다 — 그 저장소의 판정 스크립트를 띄우지 않는다(대기열 246)"
payload = { tool_name = "Bash", tool_input = { command = "git commit -F ${COMMIT_MSGS}/long-subject.txt" }, cwd = "${COMMIT_MSGS}" }

# --- hook_bash_msys_pathconv (PreToolUse Bash) ---
